{ id:'verbprep', name:'Wait for / explain to', he:'פועל + מילת יחס', tag:'"Explain me", "wait the bus", "married with": העברית מדברת דרך מילות היחס',
teach:[
 {h:'לומדים את הפועל עם מילת היחס שלו — כמו מספר טלפון',
  p:`בעברית: לחכות <b>ל</b>, להקשיב <b>ל</b>, להיכנס <b>ל</b>, לבקש <b>מ</b>, תלוי <b>ב</b>. באנגלית לכל פועל מילת יחס משלו — לפעמים אחרת, לפעמים אף אחת.<br>למה אין כלל? מילות יחס הן החלק הכי שרירותי בכל שפה. הן נקבעו בהיסטוריה, לא בהיגיון. הדרך היחידה: לזכור את הצמד כיחידה אחת — <span class="en">wait for, listen to, depend on</span>.`,
  c:[['לחכות לאוטובוס','wait the bus / wait to the bus','<b>wait for</b> the bus'],['להקשיב למוזיקה','listen music','<b>listen to</b> music'],['תלוי במזג האוויר','depends of the weather','<b>depends on</b> the weather']]},
 {h:'המלכודת של המילה המיותרת',
  p:`פעלים שבעברית יש להם ל׳ / ב׳ / עם — ובאנגלית <b>כלום</b>:<br><span class="en"><b>enter</b> the room</span> (לא enter to), <span class="en"><b>answer</b> the question</span> (לא answer to), <span class="en"><b>call</b> me</span> (לא call to), <span class="en"><b>discuss</b> the plan</span> (לא discuss about), <span class="en"><b>marry</b> someone</span> (לא marry with), <span class="en"><b>tell</b> me</span> (לא tell to me), <span class="en"><b>reach</b> the top</span>.<br>הפועל כבר מכיל את הכיוון. הוספת מילת יחס = לומר "להיכנס לתוך אל".`,
  c:[['להיכנס לחדר','enter to the room','<b>enter</b> the room'],['להתחתן עם','marry with','<b>marry</b> someone'],['לדון בתוכנית','discuss about the plan','<b>discuss</b> the plan']]},
 {h:'המלכודת ההפוכה — ומילות היחס שמתחלפות',
  p:`בעברית בלי, באנגלית עם: <span class="en">listen <b>to</b>, wait <b>for</b>, look <b>for</b></span> (לחפש), <span class="en">look <b>at</b></span> (להסתכל על), <span class="en">pay <b>for</b>, ask <b>for</b></span> (לבקש).<br>ומילת יחס שונה: <span class="en">married <b>to</b></span> (לא with), <span class="en">explain something <b>to</b> me</span> (לא explain me), <span class="en">arrive <b>at</b> the airport / <b>in</b> Paris</span> (לא arrive to), <span class="en">afraid <b>of</b></span>, <span class="en">good <b>at</b></span> (טוב ב), <span class="en">interested <b>in</b></span>, <span class="en">different <b>from</b></span>, <span class="en">angry <b>with</b></span> someone.`,
  c:[['תסביר לי','explain me','<b>explain</b> it <b>to</b> me'],['נשוי לרופאה','married with a doctor','married <b>to</b> a doctor'],['הגענו לפריז','arrived to Paris','arrived <b>in</b> Paris']]}
],
ex:[
 {t:'fix', toks:['Please','explain','me','the rule.'], bad:2, opts:['to me','for me','∅ (למחוק)'], a:0, fixed:'Please explain the rule to me.', why:'explain לא לוקח מושא אדם ישירות. מסבירים משהו ל-מישהו: explain the rule to me. (גם "explain to me the rule" מובן, אבל פחות טבעי.)'},
 {t:'fix', toks:["I'm",'waiting','the bus.'], bad:1, opts:['waiting for','waiting to','waiting at'], a:0, fixed:"I'm waiting for the bus.", why:'wait תמיד עם for. "לחכות ל" → wait for, לא wait to.'},
 {t:'fix', toks:['She','entered','to','the room.'], bad:2, opts:['∅ (למחוק)','in','into'], a:0, fixed:'She entered the room.', why:'enter כבר מכיל את ה"לתוך". enter to = כפילות. (go into the room — עם go כן צריך into.)'},
 {t:'fix', toks:['He is','married','with','a doctor.'], bad:2, opts:['to','∅ (למחוק)','on'], a:0, fixed:'He is married to a doctor.', why:'married to. with נשמע כאילו הם התחתנו ביחד עם מישהו שלישי. (אבל marry בלי מילת יחס: He married a doctor.)'},
 {t:'match', pairs:[['לחכות ל','wait for'],['להקשיב ל','listen to'],['להסתכל על','look at'],['לחפש','look for'],['תלוי ב','depend on'],['מפחד מ','afraid of'],['טוב ב','good at'],['מעוניין ב','interested in']], why:'שמונה צמדים שכדאי לדעת בעל פה. שימו לב ש"ב" בעברית הופך ל-on, at או in — לפי הפועל, לא לפי היגיון.'},
 {t:'choice', he:'זה תלוי במזג האוויר.', q:'It depends ___ the weather.', opts:['on','of','in'], a:0, why:'depend on. "תלוי ב" מפתה לומר in; דוברי צרפתית אומרים of. באנגלית — on, תמיד.'},
 {t:'choice', he:'ביקשתי ממנו עזרה.', q:'I asked him ___ help.', opts:['for','from','(כלום)'], a:0, why:'"לבקש מ-מישהו משהו" → ask someone for something. ה-from העברי נעלם; ה-for מסמן את מה שמבקשים.'},
 {t:'sort', buckets:['צריך מילת יחס','בלי מילת יחס'], items:[['listen ___ music',0],['enter ___ the room',1],['wait ___ me',0],['answer ___ the phone',1],['call ___ me tomorrow',1],['look ___ the picture',0],['discuss ___ the problem',1],['pay ___ the ticket',0]], why:'listen to, wait for, look at, pay for — צריך. enter, answer, call, discuss — הפועל כבר מכיל את הכיוון.'},
 {t:'type', he:'היא מפחדת מכלבים.', q:'She is afraid ___ dogs.', a:['of'], why:'afraid of. "מפחד מ" → of, לא from. גם: scared of, tired of, proud of.'},
 {t:'choice', he:'אני טוב במתמטיקה.', q:"I'm good ___ math.", opts:['at','in','on'], a:0, why:'good at / bad at / great at — כישרון תמיד עם at. "טוב ב" מפתה ל-in, אבל in לא נכון כאן.'}
]},

{ id:'count', name:'Advice, not advices', he:'ספיר ולא-ספיר', tag:'למה אין "informations" ולמה people כבר רבים',
teach:[
 {h:'מילים שבעברית סופרים — ובאנגלית לא',
  p:`<span class="en"><b>advice</b></span> (עצה / עצות), <span class="en"><b>information</b>, <b>furniture</b>, <b>news</b>, <b>money</b>, <b>homework</b>, <b>luggage</b>, <b>bread</b>, <b>hair</b>, <b>work</b>, <b>research</b>, <b>equipment</b>, <b>progress</b>, <b>evidence</b></span>.<br>אף פעם לא ברבים, אף פעם לא עם <span class="en">a / an</span>. למה? האנגלית רואה בהם <b>חומר</b>, לא יחידות — כמו מים או חול. רוצים לספור? מוסיפים יחידה: <span class="en">a piece of advice, two pieces of furniture, a loaf of bread</span>.`,
  c:[['שתי עצות','two advices','two <b>pieces of advice</b>'],['מידע חשוב','an important information','important <b>information</b>'],['רהיטים חדשים','new furnitures','new <b>furniture</b>']]},
 {h:'people הוא כבר רבים',
  p:`<span class="en">one <b>person</b> → two <b>people</b></span>. <span class="en bad">peoples</span> קיים רק במובן "עמים".<br>גם: <span class="en">child → children, man → men, woman → women, foot → feet, tooth → teeth</span>. ו-<span class="en">the police</span> תמיד רבים: <span class="en">The police <b>are</b> here.</span>`,
  c:[['הרבה אנשים','many peoples','many <b>people</b>'],['שלושה ילדים','three childs','three <b>children</b>']]},
 {h:'much / many / a lot of',
  p:`<span class="en"><b>many</b></span> + ספיר ברבים (<span class="en">many books</span>) · <span class="en"><b>much</b></span> + לא-ספיר (<span class="en">much time</span>) · <span class="en"><b>a lot of</b></span> + שניהם (הבטוח ביותר במשפט חיובי).<br><span class="en">How <b>many</b> people? How <b>much</b> money?</span><br>ולא-ספיר לוקח פועל ביחיד: <span class="en">The news <b>is</b> good. Money <b>isn't</b> everything. Your hair <b>is</b> long.</span>`,
  c:[['כמה כסף?','How many money?','How <b>much</b> money?'],['החדשות טובות.','The news are good.','The news <b>is</b> good.']]}
],
ex:[
 {t:'sort', buckets:['ספיר (אפשר a / רבים)','לא-ספיר (בלי a, בלי s)'], items:[['advice',1],['chair',0],['information',1],['news',1],['apple',0],['money',1],['furniture',1],['dog',0],['homework',1],['bread',1]], why:'אם אפשר לומר "one ___, two ___s" זה ספיר. advice, information, furniture, news, money, homework, bread — חומר, לא יחידות.'},
 {t:'fix', toks:['She gave me','some good','advices.'], bad:2, opts:['advice.','advise.','an advice.'], a:0, fixed:'She gave me some good advice.', why:'advice לא-ספיר: בלי s, בלי a. "כמה עצות" = some advice / a few pieces of advice. (advise עם s הוא הפועל: to advise.)'},
 {t:'fix', toks:['There were','many','peoples','at the party.'], bad:2, opts:['people','persons','person'], a:0, fixed:'There were many people at the party.', why:'people = הרבים של person. peoples = עמים (the peoples of Africa). persons קיים רק בשפה משפטית.'},
 {t:'choice', he:'כמה כסף יש לך?', q:'How ___ money do you have?', opts:['much','many','a lot'], a:0, why:'money = לא-ספיר → much. many הולך רק עם דברים שאפשר לספור (how many coins).'},
 {t:'choice', he:'החדשות טובות.', q:'The news ___ good.', opts:['is','are'], a:0, why:'news נגמר ב-s אבל הוא לא-ספיר ביחיד. The news is. גם: mathematics is, physics is.'},
 {t:'type', he:'אני צריך קצת מידע.', q:'I need some ___ (מידע).', a:['information'], why:'information — בלי s, אפילו כשמתכוונים לכמה פרטים. "informations" לא קיים.'},
 {t:'choice', he:'יש לי הרבה שיעורי בית.', q:'I have a lot of ___.', opts:['homework','homeworks','a homework'], a:0, why:'homework = לא-ספיר (העבודה כחומר). בעברית "שיעורים" ברבים, באנגלית מסה אחת.'},
 {t:'build', he:'יש לי הרבה עבודה היום.', words:['I','have','a lot of','work','today'], extra:['works','many'], why:'work (עבודה) = לא-ספיר → a lot of work, לא many works. (works = יצירות / מפעל.)'},
 {t:'choice', he:'אפשר לתת לך עצה?', q:'Can I give you ___?', opts:['a piece of advice','an advice','advices'], a:0, why:'כדי לספור לא-ספיר מוסיפים יחידה: a piece of advice. an advice לא קיים.'}
]},

{ id:'degree', name:'Bored / boring', he:'תארים ומילות מידה', tag:'"I very like it", "I am boring": איך מודדים באנגלית',
teach:[
 {h:'-ed = איך אני מרגיש. -ing = מה גורם לזה',
  p:`<span class="en">I am <b>bored</b></span> = אני משועמם. <span class="en">I am <b>boring</b></span> = אני משעמם (אחרים נרדמים לידי).<br><span class="en">interested / interesting · tired / tiring · excited / exciting · surprised / surprising · confused / confusing</span><br>למה? -ed היא צורת הסביל: משהו <b>שיעמם אותי</b>. -ing היא הפעיל: הדבר <b>משעמם</b>. בעברית יש הבדל דומה (משועמם / משעמם) — אבל באנגלית שתי המילים נראות כמעט זהות, וזה מקור הבלבול.`,
  c:[['אני משועמם.','I am boring.','I am <b>bored</b>.'],['הסרט משעמם.','The movie is bored.','The movie is <b>boring</b>.'],['אני מתעניין בהיסטוריה.','I am interesting in history.','I am <b>interested</b> in history.']]},
 {h:'very הולכת עם תארים — לא עם פעלים',
  p:`<b>אני מאוד אוהב</b> → <span class="en bad">I very like</span> ✗. <span class="en">very</span> מגבירה רק תארים ותוארי פועל (<span class="en">very good, very quickly</span>).<br>לפועל: <span class="en">I <b>really</b> like it</span> (לפני הפועל) או <span class="en">I like it <b>very much</b></span> (אחרי המושא).<br>למה? באנגלית "מאוד" מתפצל לשני תפקידים; בעברית מילה אחת שהולכת לכל מקום.`,
  c:[['אני מאוד אוהב את זה.','I very like it.','I <b>really</b> like it. / I like it <b>very much</b>.'],['זה מאוד טוב.','','It is <b>very</b> good.']]},
 {h:'so / such · too / enough · יותר מ',
  p:`<span class="en"><b>so</b> + תואר</span>: <span class="en">so tired</span> · <span class="en"><b>such</b> + (a) + שם</span>: <span class="en">such a nice day</span><br><span class="en"><b>too</b></span> = יותר מדי (שלילי): <span class="en">too hot to drink</span> · <span class="en"><b>enough</b></span> אחרי תואר, לפני שם: <span class="en">big enough, enough money</span><br>השוואה: תואר קצר + <span class="en">-er</span> (<span class="en">bigger</span>), תואר ארוך + <span class="en">more</span> (<span class="en">more beautiful</span>), ותמיד <span class="en"><b>than</b></span> — לא from! <b>יותר גדול מ</b> → <span class="en">bigger <b>than</b></span>. מיוחדים: <span class="en">good–better–best, bad–worse–worst</span>.`,
  c:[['הוא גבוה ממני.','He is taller from me.','He is taller <b>than</b> me.'],['איזה יום יפה!','What a so nice day!','<b>Such a</b> nice day! / <b>So</b> nice!'],['חם מדי','very too hot','<b>too</b> hot']]}
],
ex:[
 {t:'choice', he:'הסרט היה משעמם, אז נרדמתי.', q:'The movie was ___, so I fell asleep.', opts:['boring','bored'], a:0, why:'הסרט גורם לשעמום → -ing. אם הסרט היה bored הוא עצמו היה משתעמם.'},
 {t:'choice', he:'אני מתעניין במדע.', q:"I'm ___ in science.", opts:['interested','interesting'], a:0, why:'אני זה שמרגיש עניין → -ed. "I\'m interesting" = אני אדם מעניין.'},
 {t:'fix', toks:['I','very like','this song.'], bad:1, opts:['really like','like very','very much like'], a:0, fixed:'I really like this song.', why:'very לא יכולה לעמוד לפני פועל. לפני פועל: really. אחרי המושא: very much (I like this song very much).'},
 {t:'fix', toks:['He is','taller','from','me.'], bad:2, opts:['than','then','of'], a:0, fixed:'He is taller than me.', why:'השוואה תמיד עם than. "מ" בעברית מפתה ל-from, אבל from מסמן מקור, לא השוואה. (then = אז, מילה אחרת לגמרי.)'},
 {t:'choice', he:'היא גבוהה ממני.', q:'She is ___ me.', opts:['taller than','more tall than','taller from'], a:0, why:'tall = תואר קצר (הברה אחת) → taller. more tall לא קיים. than, לא from.'},
 {t:'type', he:'הקפה חם מדי לשתייה.', q:'This coffee is ___ (חם מדי) to drink.', a:['too hot'], why:'"מדי" = too, לפני התואר. too hot to drink = חם מכדי לשתות. very hot היה סתם "חם מאוד" בלי הבעיה.'},
 {t:'choice', he:'איזה יום יפה היה!', q:'It was ___ nice day!', opts:['such a','so','so a'], a:0, why:'לפני שם עצם (day) עם תואר → such a. so הולך רק עם תואר לבד: It was so nice!'},
 {t:'sort', buckets:['-ed (איך אני מרגיש)','-ing (איך הדבר)'], items:[["I'm ___ (tired)",0],['The book is ___ (interesting)',1],['We were ___ (surprised)',0],['The news was ___ (shocking)',1],["He's ___ (bored)",0],["It's ___ (confusing)",1]], why:'שאלו: מי מרגיש? אם הנושא מרגיש → -ed. אם הנושא גורם לתחושה → -ing.'},
 {t:'choice', he:'זו הפיצה הכי טובה בעיר.', q:'This is ___ pizza in town.', opts:['the best','the most good','the goodest'], a:0, why:'good–better–best: לא-רגיל. "הכי טוב" = the best, תמיד עם the.'}
]},

{ id:'colloc', name:'Make / do / take', he:'צירופים שלא מתרגמים', tag:'"Close the light", "said me", "make a photo": העברית שמסתתרת בפעלים',
teach:[
 {h:'לעשות מתפצל: make מול do',
  p:`<span class="en"><b>make</b></span> = ליצור משהו שלא היה: <span class="en">make a cake, make a decision, make a mistake, make money, make friends, make noise, make a plan</span><br><span class="en"><b>do</b></span> = לבצע פעילות / משימה: <span class="en">do homework, do the dishes, do business, do your best, do sport, do nothing</span><br>כלל אצבע: make מפיק <b>תוצר</b>; do הוא ה<b>תהליך</b>. לא מושלם, אבל מכסה 90%.`,
  c:[['לעשות טעות','do a mistake','<b>make</b> a mistake'],['לעשות שיעורי בית','make homework','<b>do</b> homework'],['לקבל החלטה','do a decision','<b>make</b> a decision']]},
 {h:'take — ובעיקר: לא make',
  p:`<span class="en"><b>take</b> a shower, <b>take</b> a photo, <b>take</b> a break, <b>take</b> a test, <b>take</b> medicine, <b>take</b> your time, <b>take</b> a taxi</span>.<br><span class="en bad">make a photo</span> היא טעות של כמעט כל דובר עברית — בעברית "לעשות / לצלם", באנגלית לוקחים אותה.`,
  c:[['לצלם תמונה','make a photo','<b>take</b> a photo'],['להתקלח','make a shower','<b>take</b> a shower'],['לעשות הפסקה','make a break','<b>take</b> a break']]},
 {h:'תרגומי-שאילה שצריך "ללמוד לשכוח"',
  p:`<b>לסגור / לפתוח את האור</b> → <span class="en"><b>turn off</b> / <b>turn on</b> the light</span> (close = לסגור דלת)<br><b>לעשות מסיבה</b> → <span class="en"><b>have</b> / throw a party</span><br><b>לשים לב</b> → <span class="en"><b>pay</b> attention</span><br><b>לעשות ספורט</b> → <span class="en"><b>do</b> sport / exercise / <b>work out</b></span><br><b>לעשות דיאטה</b> → <span class="en"><b>be on</b> a diet</span><br><b>אמר לי</b> → <span class="en"><b>told</b> me</span> (tell + אדם) · <b>אמר ש</b> → <span class="en"><b>said</b> that</span> (say + דברים). למה? tell דורש מאזין: tell <u>me</u>. say לא: say <u>hello</u>. <span class="en bad">He said me</span> — הטעות הקלאסית.`,
  c:[['תסגור את האור.','Close the light.','<b>Turn off</b> the light.'],['הוא אמר לי את האמת.','He said me the truth.','He <b>told</b> me the truth.'],['שים לב!','Put attention!','<b>Pay</b> attention!']]}
],
ex:[
 {t:'sort', buckets:['make','do'], items:[['homework',1],['a cake',0],['a mistake',0],['the dishes',1],['money',0],['your best',1],['a decision',0],['noise',0],['business',1],['friends',0]], why:'make = תוצר (עוגה, כסף, החלטה, חברים חדשים, רעש). do = פעילות (שיעורים, כלים, עסקים, מאמץ).'},
 {t:'fix', toks:['Please','close','the light.'], bad:1, opts:['turn off','shut','switch'], a:0, fixed:'Please turn off the light.', why:'אור לא "סוגרים" — מכבים: turn off / switch off. close = לסגור דלת, חלון, ספר. (switch לבד חסר את off.)'},
 {t:'fix', toks:['He','said','me','the truth.'], bad:1, opts:['told','said to','talked'], a:0, fixed:'He told me the truth.', why:'tell + אדם (told me). say בלי אדם ישיר (He said that…). "said to me" תקין אבל נדיר ומגושם כאן.'},
 {t:'choice', he:'אני צריך להתקלח.', q:'I need to ___ a shower.', opts:['take','make','do'], a:0, why:'take a shower (אמריקאי) / have a shower (בריטי). לעולם לא make.'},
 {t:'choice', he:'בואו נעשה מסיבה!', q:"Let's ___ a party!", opts:['have','make','do'], a:0, why:'have a party / throw a party. "לעשות מסיבה" → make זה תרגום ישיר שנשמע כאילו בונים אותה.'},
 {t:'match', pairs:[['לצלם','take a photo'],['לשים לב','pay attention'],['לעשות דיאטה','be on a diet'],['להדליק טלוויזיה','turn on the TV'],['לעשות טעות','make a mistake'],['לעשות שיעורי בית','do homework'],['לקבל החלטה','make a decision'],['לעשות הפסקה','take a break']], why:'שמונה צירופים שבעברית כולם "לעשות" / "לשים" / "לפתוח" — ובאנגלית כל אחד עם פועל אחר.'},
 {t:'choice', he:'היא עשתה טעות.', q:'She ___ a mistake.', opts:['made','did','took'], a:0, why:'make a mistake — הטעות היא "תוצר" שנוצר. made = עבר של make.'},
 {t:'type', he:'שימו לב, בבקשה!', q:'___ attention, please!', a:['Pay'], why:'pay attention. באנגלית תשומת לב היא משהו שמשלמים, לא שמים.'},
 {t:'choice', he:'אפשר לצלם תמונה?', q:'Can I ___ a photo?', opts:['take','make','do'], a:0, why:'take a photo / take a picture. make a photo היא הטעות המזוהה ביותר של דוברי עברית (וגרמנית).'}
]}
]});

LINES.push({
id:'flu', name:'Fluency', he:'שטף', color:'sky',
blurb:'המבנים שהופכים "אנגלית נכונה" ל"אנגלית טבעית".',
stations:[
{ id:'cond', name:'If it rains…', he:'משפטי תנאי', tag:'למה "If it will rain" שגוי, ומה ההבדל בין הייתי להייתי',
teach:[
 {h:'תנאי אמיתי: if + הווה, will',
  p:`<b>אם ירד גשם, נישאר בבית.</b> בעברית שני החלקים בעתיד. באנגלית: <span class="en">If it <b>rains</b>, we <b>will stay</b> home.</span><br>למה? המשפט עם if הוא <b>תנאי</b>, לא ניבוי. הוא לא אומר שירד גשם — הוא מציב מצב. מצב מנוסח בהווה; רק התוצאה בעתיד.<br>תנאי אפס (אמת כללית): <span class="en">If you heat ice, it <b>melts</b>.</span> — הווה בשני הצדדים.`,
  c:[['אם ירד גשם, נישאר בבית.','If it will rain, we will stay home.','If it <b>rains</b>, we will stay home.'],['אם תלמד, תעבור.','If you will study…','If you <b>study</b>, you will pass.']]},
 {h:'תנאי דמיוני בהווה: if + עבר, would',
  p:`<b>אם היה לי מיליון דולר, הייתי מטייל.</b> → <span class="en">If I <b>had</b> a million dollars, I <b>would travel</b>.</span><br>העבר כאן לא מסמן זמן — הוא מסמן <b>מרחק מהמציאות</b>. "אין לי מיליון". ואז would (העבר של will) בתוצאה.<br>עם be: <span class="en">If I <b>were</b> you</span> — were לכל הגופים (שריד של צורת משאלה עתיקה).`,
  c:[['אם הייתי במקומך, הייתי מסרב.','If I was you, I will refuse.','If I <b>were</b> you, I <b>would</b> refuse.'],['אם היה לי זמן, הייתי עוזר.','','If I <b>had</b> time, I <b>would help</b>.']]},
 {h:'תנאי דמיוני בעבר: if + had + V3, would have + V3',
  p:`<b>אם הייתי לומד, הייתי עובר.</b> (אבל לא למדתי — נגמר.) → <span class="en">If I <b>had studied</b>, I <b>would have passed</b>.</span><br>שימו לב: בעברית "הייתי לומד / הייתי עובר" זהה לתנאי בהווה! האנגלית מבדילה: דמיוני-עכשיו (would) מול דמיוני-עבר-שאבד (would have).<br>ולעולם לא would בתוך משפט ה-if: <span class="en bad">If I would have studied</span> ✗.`,
  c:[['אם הייתי יודע, הייתי בא.','If I would know, I would come.','If I <b>had known</b>, I <b>would have come</b>.']]}
],
ex:[
 {t:'fix', toks:['If it','will rain,','we will stay','home.'], bad:1, opts:['rains,','rained,','would rain,'], a:0, fixed:'If it rains, we will stay home.', why:'משפט ה-if בהווה, גם כשמדובר בעתיד. will נשאר רק בתוצאה.'},
 {t:'choice', he:'אם הייתי במקומך, הייתי לוקח את העבודה.', q:'If I ___ you, I would take the job.', opts:['were','was','am','will be'], a:0, why:'תנאי דמיוני → עבר, ועם be צורת were לכל הגופים. (was נשמע בדיבור, אבל were היא הצורה התקנית.)'},
 {t:'choice', he:'אם היה לי זמן, הייתי עוזר לך. (עכשיו אין לי)', q:'איזה משפט נכון?', opts:['If I had time, I would help you.','If I would have time, I will help you.','If I have time, I helped you.'], a:0, why:'דמיוני בהווה: if + עבר (had), would + בסיס. אף פעם לא would במשפט ה-if.'},
 {t:'choice', he:'אם היא הייתה לומדת יותר, היא הייתה עוברת. (אבל לא למדה)', q:'If she ___ harder, she would have passed.', opts:['had studied','studied','would study'], a:0, why:'would have passed מסמן עבר שאבד → משפט ה-if צריך had + V3. זה התנאי השלישי.'},
 {t:'sort', buckets:['אמיתי (1)','דמיוני עכשיו (2)','דמיוני בעבר (3)'], items:[["If I win, I'll celebrate.",0],['If I won, I would travel.',1],['If I had won, I would have cried.',2],["If you call me, I'll come.",0],['If I were rich…',1],['If we had left earlier, we would have made it.',2]], why:'הווה + will = אמיתי. עבר + would = דמיוני עכשיו. had V3 + would have V3 = דמיוני בעבר.'},
 {t:'build', he:'אם תלמד, תעבור.', words:['If','you','study,','you','will','pass'], extra:['will study,','would'], why:'תנאי אמיתי: if + הווה (study), תוצאה עם will. בעברית שניהם בעתיד — באנגלית רק התוצאה.'},
 {t:'type', he:'אם מחממים מים ל-100 מעלות, הם רותחים.', q:'If you heat water to 100°, it ___ (boil).', a:['boils'], why:'אמת כללית → תנאי אפס: הווה בשני הצדדים. it → boils.'},
 {t:'choice', he:'אבוא, אלא אם ירד גשם.', q:"I'll come ___ it rains.", opts:['unless','if not','except'], a:0, why:'unless = if not, במילה אחת. "אלא אם" → unless. אחריו הווה, כמו אחרי if.'}
]},

{ id:'passive', name:'Was built', he:'סביל', tag:'מ"נבנה" ל-was built: איך האנגלית בונה סביל בלי בניינים',
teach:[
 {h:'be + V3: הבניין הסביל של האנגלית',
  p:`בעברית יש בניינים: <b>בנה → נבנה</b>, <b>כתב → נכתב</b>. באנגלית אין בניינים, אז מרכיבים: <span class="en"><b>be</b> + צורה שלישית</span>.<br><span class="en">Someone built this house in 1920 → This house <b>was built</b> in 1920.</span><br>המושא הופך לנושא. למה משתמשים? כשהעושה לא ידוע, לא חשוב, או שרוצים להתחיל מהדבר החשוב. <span class="en">by</span> + העושה — רק אם צריך.`,
  c:[['הבית נבנה ב-1920.','The house built in 1920.','The house <b>was built</b> in 1920.'],['הספר נכתב על ידי אישה.','','The book <b>was written</b> by a woman.']]},
 {h:'הסביל בכל הזמנים — משנים רק את be',
  p:`<span class="en"><b>is</b> made</span> (הווה) · <span class="en"><b>was</b> made</span> (עבר) · <span class="en"><b>has been</b> made</span> (perfect) · <span class="en"><b>will be</b> made</span> (עתיד) · <span class="en"><b>is being</b> made</span> (עכשיו).<br>ה-V3 (<span class="en">made</span>) לא זז. הזמן כולו יושב על be.`,
  c:[['החדר מנוקה עכשיו.','The room is cleaning now.','The room <b>is being cleaned</b> now.'],['זה ייעשה מחר.','','It <b>will be done</b> tomorrow.']]},
 {h:'הסבילים שדוברי עברית מפספסים',
  p:`<b>נולדתי</b> → <span class="en">I <b>was born</b></span> (לא I born — אתה לא "ילדת", ילדו אותך)<br><b>קוראים לזה...</b> → <span class="en">It <b>is called</b>…</span><br><b>מדברים כאן אנגלית</b> → <span class="en">English <b>is spoken</b> here</span><br><b>תוצרת סין</b> → <span class="en"><b>Made</b> in China</span><br><b>גנבו לי את האופניים</b> → <span class="en">My bike <b>was stolen</b></span> (העברית מסתירה את העושה עם "גנבו"; האנגלית — עם סביל).`,
  c:[['נולדתי ב-1990.','I born in 1990.','I <b>was born</b> in 1990.'],['גנבו לי את האופניים.','They stole me the bike.','My bike <b>was stolen</b>.'],['קוראים לזה ספה.','They call it sofa.','It <b>is called</b> a sofa.']]}
],
ex:[
 {t:'fix', toks:['I','born','in 1990.'], bad:1, opts:['was born','am born','borned'], a:0, fixed:'I was born in 1990.', why:'"נולד" באנגלית הוא תמיד סביל: be + born. הלידה קרתה בעבר → was born.'},
 {t:'choice', he:'הספר הזה נכתב על ידי סופר מפורסם.', q:'This book ___ by a famous author.', opts:['was written','wrote','was wrote','is write'], a:0, why:'סביל בעבר: was + V3. write–wrote–written, ולכן was written. wrote היא V2 ולא מתאימה אחרי be.'},
 {t:'build', he:'אנגלית מדוברת בכל העולם.', words:['English','is','spoken','all','over','the','world'], extra:['speaks','spoke'], why:'סביל בהווה: is + spoken (V3 של speak). "בכל העולם" = all over the world.'},
 {t:'choice', he:'קוראים לזה "ספה".', q:'איזה משפט נכון?', opts:['It is called a sofa.','It calls a sofa.','It is calling a sofa.'], a:0, why:'"קוראים ל" = סביל: is called. It calls היה אומר שהדבר עצמו קורא למישהו.'},
 {t:'type', he:'החלון נשבר אתמול.', q:'The window ___ (break) yesterday.', a:['was broken'], hint:'be + V3', why:'break–broke–broken. סביל בעבר: was broken. (The window broke גם אפשרי, אבל כאן ביקשנו סביל.)'},
 {t:'choice', he:'גנבו לי את האופניים.', q:'Someone stole my bike. → סביל:', opts:['My bike was stolen.','My bike stole.','My bike was stole.','I was stolen my bike.'], a:0, why:'המושא (my bike) הופך לנושא. steal–stole–stolen → was stolen. העברית אומרת "גנבו" סתמי; האנגלית משתמשת בסביל.'},
 {t:'match', pairs:[['build','built'],['speak','spoken'],['break','broken'],['steal','stolen'],['give','given'],['make','made']], why:'הסביל תלוי לגמרי ב-V3. רבים מהם נגמרים ב-en: spoken, broken, stolen, given.'},
 {t:'choice', he:'החדר מנוקה ברגע זה.', q:'The room ___ right now.', opts:['is being cleaned','is cleaning','cleans'], a:0, why:'סביל ממושך: is being + V3. "is cleaning" היה אומר שהחדר מנקה משהו.'}
]},

{ id:'reported', name:'She said that…', he:'דיבור עקיף', tag:'למה "היא אמרה שהיא עייפה" הופך לעבר באנגלית',
teach:[
 {h:'הזמן נסוג צעד אחורה',
  p:`ישיר: <span class="en">She said, "I <b>am</b> tired."</span> → עקיף: <span class="en">She said (that) she <b>was</b> tired.</span><br>בעברית הזמן נשאר: <b>היא אמרה שהיא עייפה</b>. באנגלית הכול נסוג: <span class="en">am → was, work → worked, worked → had worked, will → would, can → could</span>.<br>למה? הדיווח קורה <b>אחרי</b> האמירה. האנגלית שומרת על נקודת המבט של המדווח: מה שהיה "עכשיו" בשבילה הוא "אז" בשבילי.`,
  c:[['היא אמרה שהיא עייפה.','She said she is tired.','She said she <b>was</b> tired.'],['הוא אמר שהוא יתקשר.','He said he will call.','He said he <b>would</b> call.']]},
 {h:'גם הכינויים ומילות הזמן זזים',
  p:`<span class="en">I → he / she · my → his / her · today → that day · tomorrow → the next day · yesterday → the day before · now → then · here → there · this → that</span><br><span class="en">"I'll see you <b>tomorrow</b>," he said → He said he would see me <b>the next day</b>.</span><br>הכול עובר לנקודת המבט של מי שמדווח.`,
  c:[['"אני אבוא מחר."','','He said he would come <b>the next day</b>.']]},
 {h:'say / tell / ask — ושאלות בדיווח',
  p:`<span class="en"><b>said</b> that</span> (בלי אדם) · <span class="en"><b>told me</b> that</span> (תמיד עם אדם) · <span class="en"><b>asked</b> me <b>if / whether</b></span> (שאלת כן/לא) · <span class="en"><b>asked</b> me where / what…</span><br>ושוב הכלל משאלות משובצות: <b>בלי היפוך</b>. <span class="en">"Where do you live?" → She asked where I <b>lived</b>.</span> לא <span class="en bad">where did I live</span>.<br>הנסיגה לא חובה כשהדבר עדיין נכון: <span class="en">He said the Earth <b>is</b> round.</span>`,
  c:[['היא שאלה איפה אני גר.','She asked where do I live.','She asked where I <b>lived</b>.'],['הוא שאל אם אני רעב.','He asked if I am hungry.','He asked <b>if</b> I <b>was</b> hungry.']]}
],
ex:[
 {t:'choice', he:'"אני שמחה," היא אמרה.', q:'She said, "I am happy." →', opts:['She said (that) she was happy.','She said that she is happy.','She said me she was happy.'], a:0, why:'am → was (נסיגה). said בלי אדם ישיר; "said me" לא קיים.'},
 {t:'choice', he:'"אני אתקשר אלייך," הוא אמר.', q:'He said, "I will call you." →', opts:['He said he would call me.','He said he will call me.','He said he would call you.'], a:0, why:'will → would. וגם הכינוי משתנה: "you" מנקודת המבט שלו = me מנקודת המבט שלי.'},
 {t:'fix', toks:['She','told','that she was busy.'], bad:1, opts:['said','told me','talked'], a:0, fixed:'She said that she was busy.', why:'tell חייב מאזין: told me that. בלי מאזין → said that. (told me היה גם נכון — שתי הדרכים תקינות.)'},
 {t:'choice', he:'הוא שאל אותי איפה אני גר.', q:'He asked me where ___.', opts:['I lived','did I live','do I live'], a:0, why:'שאלה בדיווח = סדר חיווי (I lived), בלי do/did. וגם נסיגה: live → lived.'},
 {t:'type', he:'"אני יודע לשחות," הוא אמר.', q:'"I can swim," he said. → He said he ___ swim.', a:['could'], why:'can → could בנסיגה. הצורה הפשוטה ביותר: כל מודאל בהווה הופך לצורת העבר שלו.'},
 {t:'match', pairs:[['today','that day'],['tomorrow','the next day'],['yesterday','the day before'],['now','then'],['here','there'],['this','that']], why:'מילות זמן ומקום עוברות לנקודת המבט של המדווח, שנמצא במקום אחר ובזמן אחר.'},
 {t:'build', he:'היא שאלה אם אני רעב.', words:['She','asked','if','I','was','hungry'], extra:['am','whether I'], why:'שאלת כן/לא בדיווח → if (או whether). am → was בנסיגה. סדר חיווי: I was.'},
 {t:'choice', he:'"סיימתי," אמר תום.', q:'Tom said, "I have finished." →', opts:['Tom said he had finished.','Tom said he has finished.','Tom said he finished.'], a:0, why:'Present Perfect נסוג ל-Past Perfect: have finished → had finished. הצעד "אחורה" מ-perfect הוא had.'}
]},

{ id:'relative', name:'The man who…', he:'משפטי זיקה', tag:'למה "the man that I talked to him" מיותר במילה אחת',
teach:[
 {h:'ש׳ אחת בעברית — who / which / that / whose / where באנגלית',
  p:`<b>האיש ש</b>התקשר → <span class="en">The man <b>who</b> called</span> (אנשים)<br><b>הספר ש</b>קניתי → <span class="en">The book <b>which / that</b> I bought</span> (דברים)<br><b>הילדה ש</b>אחיה טייס → <span class="en">The girl <b>whose</b> brother is a pilot</span> (שייכות)<br><b>העיר ש</b>גדלתי בה → <span class="en">The city <b>where</b> I grew up</span> (מקום)<br><span class="en">that</span> מתאים לאנשים ולדברים, בדיבור.`,
  c:[['האישה שגרה כאן','the woman which lives here','the woman <b>who</b> lives here'],['היום שנפגשנו','the day which we met','the day <b>when</b> we met']]},
 {h:'בלי כינוי חוזר — הטעות של דוברי העברית',
  p:`בעברית: <b>האיש שדיברתי <u>איתו</u></b>, <b>הספר שקראתי <u>אותו</u></b>. באנגלית הכינוי החוזר <b>אסור</b>:<br><span class="en">The man (that) I talked <b>to</b></span> — לא <span class="en bad">that I talked to him</span>.<br>למה? <span class="en">that / who / which</span> כבר ממלאים את התפקיד של "אותו / איתו". הוספת him = לומר את אותו הדבר פעמיים. מילת היחס נשארת בסוף, לבד.`,
  c:[['האיש שדיברתי איתו','the man that I talked to him','the man <b>I talked to</b>'],['הבית שאני גר בו','the house where I live in it','the house <b>I live in</b>'],['הסרט שסיפרתי לך עליו','','the film <b>I told you about</b>']]},
 {h:'מתי אפשר להשמיט את המילה',
  p:`כשהכינוי הוא <b>המושא</b> — אפשר להשמיט: <span class="en">The book <s>that</s> I read. The man <s>who</s> I saw.</span><br>כשהכינוי הוא <b>הנושא</b> — חובה: <span class="en">The man <b>who</b> called me</span> (לא The man called me — זה משפט אחר).<br>למה? באנגלית לכל פסוקית צריך נושא גלוי. אם that הוא הנושא ומוחקים אותו — הפסוקית נשארת בלי נושא.`,
  c:[['הספר שקראתי','','The book (that) I read'],['האיש שהתקשר','The man called','The man <b>who</b> called']]}
],
ex:[
 {t:'fix', toks:['The man that','I talked to','him','is my boss.'], bad:2, opts:['∅ (למחוק)','he','whom'], a:0, fixed:'The man that I talked to is my boss.', why:'that כבר "הוא" האיש. him חוזר עליו פעם שנייה. באנגלית מילת היחס (to) נשארת בסוף בלי כינוי אחריה.'},
 {t:'choice', he:'האישה שגרה בבית ליד היא רופאה.', q:'The woman ___ lives next door is a doctor.', opts:['who','which','whom'], a:0, why:'אדם + נושא של הפסוקית → who. which לדברים. whom רק כמושא, ופורמלי.'},
 {t:'choice', he:'זה הספר שסיפרתי לך עליו.', q:'This is the book ___ I told you about.', opts:['that','who','what','whose'], a:0, why:'דבר (book) → that / which. שימו לב: about נשאר בסוף, בלי it אחריו.', wrong:{2:'what לא משמש כמילת זיקה אחרי שם עצם. what = "מה ש" בלי שם עצם לפניו.'}},
 {t:'build', he:'העיר שגדלתי בה יפה.', words:['The','city','I','grew up','in','is','beautiful'], extra:['in it','where'], alt:[['The','city','where','I','grew up','is','beautiful']], why:'שתי דרכים: "the city I grew up in" (מילת היחס בסוף, בלי it) או "the city where I grew up" (where מחליף את in). אף פעם לא "in it".'},
 {t:'type', he:'זו הבחורה שאחיה טייס.', q:"That's the girl ___ brother is a pilot.", a:['whose'], why:'שייכות ("ש-אחיה") → whose. זו המילה היחידה במשפחה שמסמנת "של".'},
 {t:'choice', he:'אני זוכר את היום שנפגשנו.', q:'I remember the day ___ we met.', opts:['when','which','where'], a:0, why:'זמן (day) → when. where למקום. which היה דורש מילת יחס: the day on which we met.'},
 {t:'sort', buckets:['אפשר להשמיט','חייב להשאיר'], items:[['The film (that) we saw',0],['The man (who) called me',1],['The car (which) she bought',0],['The doctor (who) helped us',1],['The song (that) I love',0],['The bus (that) goes downtown',1]], why:'אם אחרי המילה יש נושא אחר (we, she, I) — היא מושא ואפשר להשמיט. אם אחריה בא ישר פועל — היא הנושא וחובה.'},
 {t:'fix', toks:['The house','where','I live','in','is old.'], bad:3, opts:['∅ (למחוק)','at','in it'], a:0, fixed:'The house where I live is old.', why:'where כבר מכיל את ה"בו". where + in = כפול. או where I live, או (that) I live in — לא שניהם.'}
]},

{ id:'polite', name:'Could you…?', he:'נימוס ומשלב', tag:'למה "Give me water" נשמע גס — גם כשבעברית זה בסדר',
teach:[
 {h:'עברית ישירה, אנגלית עוטפת',
  p:`<b>תן לי מים</b> / <b>אפשר מים?</b> — נורמלי לגמרי בעברית. באנגלית <span class="en">Give me water</span> נשמע כמו פקודה לחייל.<br>למה? באנגלית נימוס = <b>מרחק ועקיפות</b>. ככל שהמשפט ארוך יותר, מותנה יותר ובזמן עבר — הוא מנומס יותר. הבקשה "מתחפשת" לשאלה על אפשרות.<br>זה לא שדוברי עברית גסים — פשוט המערכת שונה. אבל באנגלית זה נשמע גס, וכדאי לדעת.`,
  c:[['תן לי מים.','Give me water.','<b>Could I have</b> some water, please?'],['תסגור את הדלת.','Close the door.','<b>Could you</b> close the door, please?']]},
 {h:'סולם הבקשות',
  p:`<span class="en">Give me…</span> (פקודה) → <span class="en"><b>Can I have</b>…?</span> (יומיומי) → <span class="en"><b>Could I have</b>…?</span> (מנומס) → <span class="en"><b>I'd like</b>…</span> (במסעדה, בחנות) → <span class="en"><b>Would you mind</b> + ing?</span> (מנומס מאוד) → <span class="en"><b>I was wondering if</b> you could…</span> (בקשה גדולה).<br><span class="en">please</span> בסוף או לפני הפועל. <span class="en">I want</span> — רק עם חברים; במסעדה <span class="en">I'd like</span>.`,
  c:[['אני רוצה קפה. (במסעדה)','I want a coffee.','<b>I\'d like</b> a coffee, please.'],['תוכל לעזור לי?','','<b>Could you</b> help me?']]},
 {h:'ריכוך, אי-הסכמה, וטקסים קטנים',
  p:`אי-הסכמה: <span class="en">You're wrong</span> → <span class="en"><b>I'm not sure I agree</b></span> / <span class="en"><b>I see it a bit differently</b></span>.<br>סירוב: <span class="en">No</span> → <span class="en"><b>I'm afraid</b> I can't</span>.<br>טקסים: <span class="en">How are you?</span> היא ברכה, לא שאלה — התשובה: <span class="en"><b>Good, thanks. You?</b></span> · <span class="en">Thank you</span> → <span class="en"><b>You're welcome</b> / No problem</span> · לא שמעת → <span class="en"><b>Sorry?</b></span> (לא What?!) · נתקלת במישהו → <span class="en"><b>Sorry!</b></span> · רוצה תשומת לב → <span class="en"><b>Excuse me</b></span>.`,
  c:[['מה? (לא שמעתי)','What?','<b>Sorry?</b> / Pardon?'],['אתה טועה.','You are wrong.','<b>I\'m not sure</b> that\'s right.']]}
],
ex:[

teach:[

  p:`<span class="en">give <b>up</b></span> = לוותר, <span class="en">look <b>after</b></span> = לטפל, <span class="en">put <b>off</b></span> = לדחות, <span class="en">run <b>into</b></span> = להיתקל, <span class="en">work <b>out</b></span> = להתאמן / להסתדר, <span class="en">figure <b>out</b></span> = להבין.<br>המשמעות לא מילולית — <span class="en">give up</span> אינו "לתת למעלה". דוברי עברית נוטים לפועל לטיני יחיד (<span class="en">continue, tolerate, discover</span>); דוברי אנגלית מעדיפים את הצירוף בדיבור (<span class="en">carry on, put up with, find out</span>).`,
  c:[['הוא ויתר.','He gave up.','He <b>gave up</b>.'],['נתקלתי בחבר ישן.','I met into an old friend.','I <b>ran into</b> an old friend.'],['בוא נדחה את הפגישה.','','Let\'s <b>put off</b> the meeting.']]},
 {h:'ניתנים להפרדה — והכינוי חייב לקפוץ לאמצע',
  p:`עם שם עצם, שתי הצורות תקינות: <span class="en">turn <b>off</b> the light</span> / <span class="en">turn the light <b>off</b></span>.<br>אבל עם כינוי (<span class="en">it, them, him</span>) — הוא <b>חייב</b> לבוא באמצע: <span class="en">turn <b>it</b> off</span> ✓ · <span class="en bad">turn off it</span> ✗.<br>למה? הכינוי הוא מידע "קל" וישן, והאנגלית דוחפת אותו קרוב לפועל, לפני המילית הכבדה.`,
  c:[['תכבה אותו.','Turn off it.','Turn <b>it</b> off.'],['מלאתי את הטופס.','I filled in it.','I filled <b>it</b> in.']]},
 {h:'לא ניתנים להפרדה',
  p:`חלק מהצירופים לא נפרדים — הכינוי בא <b>אחרי</b> המילית:<br><span class="en">look after <b>him</b></span> (לא look him after), <span class="en">run into <b>her</b>, get over <b>it</b>, deal with <b>it</b>, come across <b>them</b></span>.<br>אין דרך לדעת מהצורה — לומדים כל צירוף עם ההתנהגות שלו, בדיוק כמו שלומדים פועל עם מילת היחס שלו.`,
  c:[['היא מטפלת בהם.','She looks them after.','She <b>looks after them</b>.'],['תתגבר על זה.','Get it over.','<b>Get over it</b>.']]}
],

{ id:'causative', name:'Had it done', he:'הגורם והסביל האישי', tag:'"הסתפרתי" זה לא "חתכתי את השיער שלי"',
teach:[
 {h:'have / get something done = מישהו אחר עשה לך',
  p:`<span class="en">I <b>cut</b> my hair</span> = חתכתי בעצמי. <span class="en">I <b>had</b> my hair <b>cut</b></span> = הסתפרתי (הספר חתך).<br>המבנה: <span class="en">have + מושא + V3</span>. הוא אומר שגרמת לשירות להיעשות, בלי לומר בידי מי.<br>בעברית הבניין עושה את זה (הסתפרתי, תיקנתי = מסרתי לתיקון); באנגלית המבנה <span class="en">have … done</span> הוא הדרך.`,
  c:[['הסתפרתי אתמול.','I cut my hair yesterday.','I <b>had</b> my hair <b>cut</b> yesterday.'],['תיקנתי את המכונית.','I repaired my car.','I <b>had</b> my car <b>repaired</b>.'],['צילמנו את הבית.','','We <b>had</b> the house <b>photographed</b>.']]},
 {h:'get = גרסה יומיומית יותר',
  p:`בדיבור, <span class="en">get</span> מחליף את <span class="en">have</span> באותו מבנה: <span class="en">I need to <b>get</b> my phone <b>fixed</b>. She <b>got</b> her nails <b>done</b>.</span><br>שתי הצורות זהות במשמעות; <span class="en">get</span> פחות פורמלי. הזמן יושב על have/get: <span class="en">had / will have / am having … done</span>.`,
  c:[['אני צריך לתקן את הטלפון.','I need to fix my phone (במעבדה).','I need to <b>get</b> my phone <b>fixed</b>.'],['היא עשתה ציפורניים.','','She <b>got</b> her nails <b>done</b>.']]},
 {h:'דיווח לא-אישי: It is said that…',
  p:`כדי לדווח דעה כללית בלי לומר מי אמר: <span class="en"><b>It is said that</b> he is rich.</span> / <span class="en">He <b>is said to be</b> rich.</span><br>גם: <span class="en">It is believed / thought / reported / known that…</span><br>בעברית "אומרים ש...", "ידוע ש..." — סתמי. האנגלית משתמשת בסביל לא-אישי כדי להשיג את אותה סתמיות מכובדת (נפוץ בעיתונות ובאקדמיה).`,
  c:[['אומרים שהוא עשיר.','They say he is rich. →','<b>It is said that</b> he is rich.'],['ידוע שעישון מזיק.','','<b>It is known that</b> smoking is harmful.']]}
],

 {t:'type', he:'היא צבעה את הבית (מישהו צבע לה).', q:'She ___ her house ___ (paint).', a:['had','painted','got'], why:'have/get + house + painted. הצורה השלישית של paint היא painted; הבעלים לא צבעו בעצמם.'},

 {t:'choice', he:'עליי לבדוק את העיניים (אצל רופא).', q:'I must ___.', opts:['have my eyes tested','test my eyes','have tested my eyes'], a:0, why:'רופא בודק, לא אתה → have my eyes tested (מושא לפני V3).'},
 {t:'build', he:'מאמינים שהוא עזב את המדינה.', words:['It','is','believed','that','he','has','left','the','country'], extra:['believes','leaving'], why:'דיווח לא-אישי: It is believed that + משפט מלא. believe → believed (V3) בסביל.'}
]}

{ id:'wish', name:'I wish I had…', he:'משאלות ועבר לא-ממשי', tag:'"הלוואי" שמשתמש בעבר כדי לדבר על ההווה',
teach:[
 {h:'wish + עבר = צער על ההווה',
  p:`<span class="en">I <b>wish</b> I <b>had</b> a car.</span> = הלוואי שהיה לי מכונית (אין לי, עכשיו).<br>העבר (<span class="en">had</span>) לא מסמן זמן — הוא מסמן <b>ריחוק מהמציאות</b>, בדיוק כמו בתנאי הדמיוני.<br>עם be: <span class="en">I wish I <b>were</b> taller</span> (were לכל הגופים).<br>בעברית "הלוואי ש..." + הווה; באנגלית wish + עבר. זו המלכודת המרכזית.`,
  c:[['הלוואי שהיה לי זמן.','I wish I have time.','I wish I <b>had</b> time.'],['הלוואי שהייתי גבוה יותר.','I wish I was taller. (בדיבור) →','I wish I <b>were</b> taller.']]},
 {h:'wish + עבר מושלם = צער על העבר',
  p:`<span class="en">I <b>wish</b> I <b>had studied</b> harder.</span> = הלוואי שהייתי לומד יותר (אבל לא למדתי — נגמר).<br>ההבחנה שהעברית לא עושה: "הלוואי שהייתי לומד" יכול להיות על עכשיו או על אתמול; באנגלית <span class="en">wish + had + V3</span> אומר בבירור: מאוחר מדי, זה כבר קרה.`,
  c:[['הלוואי שלא אמרתי את זה.','I wish I didn\'t say that.','I wish I <b>hadn\'t said</b> that.'],['הלוואי שהקשבתי לך.','','I wish I <b>had listened</b> to you.']]},
 {h:'wish + would · would rather · it\'s time',
  p:`<span class="en">wish + <b>would</b></span> = מרגיז אותי, הלוואי שישתנה: <span class="en">I wish you <b>would stop</b> shouting.</span><br><span class="en"><b>would rather</b></span> = מעדיף: <span class="en">I'd rather <b>stay</b></span> (+ בסיס) · <span class="en">I'd rather you <b>stayed</b></span> (+ עבר, לגוף אחר).<br><span class="en"><b>It's (high) time</b></span> + עבר: <span class="en">It's time we <b>left</b>.</span> (הגיע הזמן שנלך) — שוב, עבר לא-ממשי להווה.`,
  c:[['הלוואי שתפסיק לאחר.','I wish you stop being late.','I wish you <b>would stop</b> being late.'],['הגיע הזמן שנלך.','It\'s time we go.','It\'s time we <b>left</b>.']]}
],

<script>/* ===== Grammar Underground — engine ===== */
(function(){
'use strict';
const COLORS={coral:'#E8503A',amber:'#E2A11C',teal:'#1FA79A',violet:'#7B61E0',sky:'#3B8FD9',rose:'#D6456E',indigo:'#5348C7'};
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const plain=s=>String(s).replace(/<[^>]+>/g,'');

/* ---------- persistence ---------- */
const DEF={xp:0,best:0,done:{},lines:{},mistakes:[],seen:{},last:null,settings:{sound:true,tts:true,theme:'auto'}};
let store=load();
function load(){try{const s=JSON.parse(localStorage.getItem('gu.v1')||'{}');return Object.assign({},DEF,s,{settings:Object.assign({},DEF.settings,s.settings||{})});}catch(e){return JSON.parse(JSON.stringify(DEF));}}
function save(){try{localStorage.setItem('gu.v1',JSON.stringify(store));}catch(e){}}
function applyTheme(){const t=store.settings.theme;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);}
applyTheme();

/* ---------- lookups ---------- */
const ALL=[];LINES.forEach((L,li)=>L.stations.forEach((S,si)=>{S.line=L;S.li=li;S.si=si;ALL.push(S);}));
const byId=id=>ALL.find(s=>s.id===id);
const isDone=id=>!!store.done[id];
const unlocked=S=>S.si===0||isDone(S.line.stations[S.si-1].id);
const lineDone=L=>L.stations.every(s=>isDone(s.id));
const nextStation=S=>{const L=S.line;if(S.si<L.stations.length-1)return L.stations[S.si+1];const nl=LINES[S.li+1];return nl?nl.stations[0]:null;};
const totalDone=()=>ALL.filter(s=>isDone(s.id)).length;

/* ---------- audio ---------- */
let AC=null;
function beep(kind){
  if(!store.settings.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime;
    const tone=(f,st,d,type,g)=>{const o=AC.createOscillator(),v=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t+st);v.gain.setValueAtTime(0,t+st);v.gain.linearRampToValueAtTime(g||.18,t+st+.01);v.gain.exponentialRampToValueAtTime(.0001,t+st+d);o.connect(v).connect(AC.destination);o.start(t+st);o.stop(t+st+d+.02);};
    if(kind==='ok'){tone(523,0,.18);tone(659,.09,.22);}
    else if(kind==='bad'){tone(180,0,.22,'square',.08);tone(150,.1,.25,'square',.08);}
    else if(kind==='tick'){tone(880,0,.05,'triangle',.08);}
    else if(kind==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.3));tone(1319,.5,.5);}
    else if(kind==='combo'){tone(988,0,.1,'triangle',.12);tone(1319,.08,.16,'triangle',.12);}
  }catch(e){}
}
let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Samantha|Google US|Microsoft (Aria|Jenny|Zira)/i.test(v.name))||vs.find(v=>/en[-_](US|GB)/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text,btn){
  if(!store.settings.tts||!('speechSynthesis' in window))return;
  try{

  cur.xp+=xp;store.xp+=xp;save();
  beep(ok?'ok':'bad');
  showResult({ok,xp,why:ex.why,correct:extra.correct,wrongNote:extra.wrongNote,onNext:()=>{cur.i++;renderStep();}});
}

  if(kind==='pastnow')marks=`<line x1="80" y1="${y}" x2="${now-4}" y2="${y}" stroke="var(--lc)" stroke-width="9" stroke-linecap="round"/><circle cx="80" cy="${y}" r="7" fill="var(--lc)"/><path d="M${now-14},${y-9} l12,9 l-12,9" fill="none" stroke="var(--lc)" stroke-width="3" stroke-linecap="round"/><text x="135" y="${y-16}" text-anchor="middle" font-size="11" fill="var(--muted)">התחיל אז, נמשך עד עכשיו</text>`;
  if(kind==='future')marks=`<circle cx="290" cy="${y}" r="7" fill="none" stroke="var(--lc)" stroke-width="3" stroke-dasharray="3 3"/><text x="290" y="${y-16}" text-anchor="middle" font-size="11" fill="var(--muted)">עוד לא קרה</text>`;
  return `<div class="fig"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ציר זמן"><line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="var(--hair)" stroke-width="2"/><path d="M${x1-8},${y-5} l8,5 l-8,5" fill="none" stroke="var(--hair)" stroke-width="2"/><line x1="${now}" y1="${y-11}" x2="${now}" y2="${y+11}" stroke="var(--ink)" stroke-width="2.5"/><text x="${now}" y="${y+28}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">עכשיו</text><text x="${x0}" y="${y+28}" text-anchor="start" font-size="11" fill="var(--muted)">עבר</text><text x="${x1}" y="${y+28}" text-anchor="end" font-size="11" fill="var(--muted)">עתיד</text>${marks}</svg></div>`;
}

RENDER.build=function(ex,root){
  let slips=0;
  const tiles=shuffle(ex.words.concat(ex.extra||[]).map((w,i)=>({w,i})));
  const picked=[];
  root.innerHTML=`<div class="prompt"><div class="task">בנה את המשפט באנגלית. לחץ על מילה כדי להוסיף אותה, ועליה שוב כדי להחזיר.</div><div class="he">${esc(ex.he)}</div></div>
  <div class="answer" id="ans" data-ph="המשפט שלך יופיע כאן…"></div><div class="bank" id="bank"></div><div id="note"></div>`;
  const ans=$('#ans',root),bank=$('#bank',root);
  const draw=()=>{
    bank.innerHTML=tiles.map(t=>`<button class="tile ${picked.includes(t.i)?'ghost':''}" data-i="${t.i}">${esc(t.w)}</button>`).join('');
    ans.innerHTML=picked.map(i=>`<button class="tile" data-p="${i}">${esc(tiles.find(t=>t.i===i).w)}</button>`).join('');
    ans.classList.remove('bad');
    $$('.tile',bank).forEach(b=>b.onclick=()=>{if(picked.includes(+b.dataset.i))return;picked.push(+b.dataset.i);beep('tick');draw();});
    $$('.tile',ans).forEach(b=>b.onclick=()=>{picked.splice(picked.indexOf(+b.dataset.p),1);beep('tick');draw();});
    $('#primary').disabled=!picked.length;
  };
  const correctStr=ex.words.join(' ');
  const check=()=>{
    const got=picked.map(i=>tiles.find(t=>t.i===i).w);
    const seqs=[ex.words].concat(ex.alt||[]);
    const ok=seqs.some(s=>s.length===got.length&&s.every((w,k)=>w===got[k]));
    if(ok){ans.classList.add('ok');$$('.tile',ans).forEach(t=>t.classList.add('right'));$$('.tile',root).forEach(t=>t.onclick=null);finish(ex,true,{slips,correct:esc(got.join(' '))});return;}
    slips++;beep('bad');
    const best=seqs[0];let k=0;while(k<got.length&&k<best.length&&got[k]===best[k])k++;
    $$('.tile',ans).forEach((t,j)=>{t.classList.toggle('right',j<k);if(j===k)t.classList.add('wrong');});
    if(k===got.length&&got.length<best.length)ans.classList.add('bad');
    if(slips>=2){picked.length=0;ans.innerHTML=ex.words.map(w=>`<span class="tile right">${esc(w)}</span>`).join('');ans.classList.add('ok');$$('.tile',bank).forEach(t=>{t.classList.add('ghost');t.onclick=null;});finish(ex,false,{correct:esc(correctStr)});}
    else $('#note',root).innerHTML=`<div class="note"><b>עוד לא.</b> ${k<got.length?'המילים הירוקות במקום. הבעיה מתחילה במילה האדומה.':'ההתחלה נכונה — חסר משהו בהמשך.'} נסה שוב.</div>`;
  };
  setPrimary('בדוק',check,false,'');
  draw();
};

RENDER.sort=function(ex,root){
  const items=shuffle(ex.items);let idx=0,slips=0,wrongHere=false;const counts=ex.buckets.map(()=>[]);
  const isHe=/[֐-׿]/.test(items[0][0]);
  root.innerHTML=`<div class="prompt"><div class="task">לאיזו קבוצה שייך כל פריט? לחץ על הקופסה הנכונה.</div></div>
  <div class="sortwrap"><div class="deck" id="deck"></div><div class="buckets" style="--n:${ex.buckets.length}">${ex.buckets.map((b,i)=>`<button class="bucket" data-b="${i}"><span class="cnt" hidden>0</span>${esc(b)}<div class="items"></div></button>`).join('')}</div><div class="sortdone" id="sd"></div></div>`;
  const deck=$('#deck',root);
  const show=()=>{if(idx>=items.length){deck.innerHTML='';$('#sd',root).textContent=`הכול ממוין. ${items.length-slips} מתוך ${items.length} בניסיון ראשון.`;$$('.bucket',root).forEach(b=>b.disabled=true);finish(ex,slips<=Math.max(1,Math.floor(items.length/4)),{slips});return;}
    deck.innerHTML=`<div class="scard ${isHe?'he':''}">${esc(items[idx][0])}</div>`;$('#sd',root).textContent=`${idx+1} / ${items.length}`;wrongHere=false;};
  setPrimary('מיין',null,false,'');
  $$('.bucket',root).forEach(b=>b.onclick=()=>{
    if(idx>=items.length)return;const k=+b.dataset.b,it=items[idx],card=$('.scard',deck);
    if(k===it[1]){beep('tick');b.classList.add('ok');counts[k].push(it[0]);const cnt=$('.cnt',b);cnt.hidden=false;cnt.textContent=counts[k].length;$('.items',b).innerHTML=counts[k].map(x=>`<span>${esc(x)}</span>`).join('');
      const r1=card.getBoundingClientRect(),r2=b.getBoundingClientRect();card.classList.add('fly');card.style.transform=`translate(${r2.left+r2.width/2-(r1.left+r1.width/2)}px,${r2.top+r2.height/2-(r1.top+r1.height/2)}px) scale(.3)`;
      setTimeout(()=>{b.classList.remove('ok');idx++;show();},260);}
    else{if(!wrongHere){slips++;wrongHere=true;}beep('bad');b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');card.classList.remove('wrong');void card.offsetWidth;card.classList.add('wrong');setTimeout(()=>b.classList.remove('bad'),450);}

RENDER.match=function(ex,root){
  const L=ex.pairs.map((p,i)=>({t:p[0],i})),R=shuffle(ex.pairs.map((p,i)=>({t:p[1],i})));
  const isHe=s=>/[֐-׿]/.test(s);
  let sel=null,slips=0,done=0;const pal=Object.values(COLORS);
  root.innerHTML=`<div class="prompt"><div class="task">התאם כל פריט משמאל לבן הזוג שלו מימין. לחץ על אחד, ואז על ההתאמה.</div></div>
  <div class="match"><div class="col" id="cl">${L.map(x=>`<button class="mi ${isHe(x.t)?'he':''}" data-l="${x.i}">${esc(x.t)}</button>`).join('')}</div><div class="col" id="cr">${R.map(x=>`<button class="mi ${isHe(x.t)?'he':''}" data-r="${x.i}">${esc(x.t)}</button>`).join('')}</div></div>`;
  setPrimary('התאם',null,false,'');
  const all=$$('.mi',root);
  all.forEach(b=>b.onclick=()=>{
    if(b.classList.contains('lock'))return;
    const side=b.dataset.l!==undefined?'l':'r';
    if(!sel){sel=b;b.classList.add('sel');beep('tick');return;}
    if(sel===b){b.classList.remove('sel');sel=null;return;}
    const sside=sel.dataset.l!==undefined?'l':'r';
    if(sside===side){sel.classList.remove('sel');sel=b;b.classList.add('sel');beep('tick');return;}
    const a=+(sel.dataset.l??sel.dataset.r),c=+(b.dataset.l??b.dataset.r);
    if(a===c){const col=pal[done%pal.length];[sel,b].forEach(x=>{x.classList.remove('sel');x.classList.add('lock');x.style.setProperty('--pc',col);x.disabled=true;});done++;beep(done===L.length?'ok':'tick');
      if(!isHe(b.textContent))speak(b.textContent);else if(!isHe(sel.textContent))speak(sel.textContent);
      sel=null;if(done===L.length)finish(ex,slips<=1,{slips});}
    else{slips++;beep('bad');[sel,b].forEach(x=>{x.classList.remove('sel');x.classList.add('bad');});const s0=sel;sel=null;setTimeout(()=>{[s0,b].forEach(x=>x.classList.remove('bad'));},450);}
  });
};

/* ---------- summary ---------- */
function summary(){
  const S=cur.station,c=COLORS[cur.line.color],pct=cur.correct/cur.total;
  let passed=true,title='',sub='';
  if(cur.mode==='station'){
    const prev=store.done[S.id];
    store.done[S.id]={score:Math.max(cur.correct,prev?prev.score:0),total:cur.total,ts:Date.now()};
    store.seen[S.id]=(store.seen[S.id]||0)+1;
    title=pct===1?'תחנה נקייה — בלי טעויות.':pct>=.75?'התחנה הושלמה.':'התחנה הושלמה — כדאי לחזור.';
    sub=pct===1?'כל הכללים של התחנה יושבים.':'הטעויות נשמרו במחברת לתרגול חוזר.';
  }else if(cur.mode==='terminus'){
    passed=cur.correct>=8;if(passed)store.lines[cur.lineId]=true;
    title=passed?'הקו נסגר.':'עוד לא — צריך 8 מתוך 10.';
    sub=passed?'כל התחנות בקו הזה נבדקו ואושרו.':'חזור לתחנות שבהן טעית ונסה שוב.';
  }else{title=cur.correct===cur.total?'המחברת התנקתה.':'תרגול הושלם.';sub=`${cur.correct} טעויות נמחקו מהמחברת.`;}
  save();
  const nx=cur.mode==='station'?nextStation(S):null;
  const mis=cur.misses.map(m=>`<li><span class="en">${esc(m.ex.q?m.ex.q.replace(/^איזה משפט.*$/,''):m.ex.he||m.ex.fixed||'')}</span> — ${esc(plain(m.ex.why).slice(0,110))}${plain(m.ex.why).length>110?'…':''}</li>`).join('');
  shell(header()+`<article class="card sum" style="--lc:${c}">
    ${passed?`<div class="stamp">${cur.mode==='station'?'Station cleared':cur.mode==='terminus'?'Line complete':'Reviewed'}<small>${cur.mode==='station'?'תחנה הושלמה':cur.mode==='terminus'?'הקו הושלם':'תורגל'}</small></div>`:''}
    <h3>${title}</h3><p style="color:var(--muted);margin:0">${sub}</p>
    <div class="nums"><div><b style="color:${c}">${cur.correct}/${cur.total}</b><span>נכון</span></div><div><b>+${cur.xp}</b><span>XP</span></div><div><b>${store.best}</b><span>רצף שיא</span></div></div>
    ${mis?`<ul class="mis">${mis}</ul>`:''}
    <div class="acts">${nx?`<button class="btn" style="--lc:${COLORS[nx.line.color]}" data-go="${nx.id}">התחנה הבאה: ${esc(nx.name)} ←</button>`:''}${cur.mode==='station'&&lineDone(cur.line)&&!store.lines[cur.line.id]?`<button class="btn" style="--lc:${c}" data-review="${cur.line.id}">מבחן הקו (Terminus)</button>`:''}${cur.mode==='terminus'&&!passed?`<button class="btn" style="--lc:${c}" data-review="${cur.lineId}">נסה שוב</button>`:''}<button class="btn ghost" data-nav="map">למפה</button>${cur.misses.length&&cur.mode!=='mistakes'?`<button class="btn ghost" data-nav="notebook">למחברת</button>`:''}</div>
  </article>`,'');
  $$('[data-nav]',app).forEach(b=>b.onclick=e=>{e.preventDefault();cur=null;go(b.dataset.nav,b.dataset.nav==='notebook'?'mistakes':undefined);});
  $$('[data-go]',app).forEach(b=>b.onclick=()=>go('station',b.dataset.go));
  $$('[data-review]',app).forEach(b=>b.onclick=()=>go('review',b.dataset.review));
  if(passed){beep('win');confetti([c,'#fff',COLORS.amber,COLORS.sky]);}
  cur.i=cur.steps.length;
}

/* ---------- notebook ---------- */
function renderNotebook(tab){
  tab=tab||'rules';
  const learned=ALL.filter(S=>store.seen[S.id]||isDone(S.id));
  let body='';
  if(tab==='rules'){
    if(!learned.length)body=`<div class="empty"><b>המחברת עדיין ריקה.</b>כל כלל שתלמד בתחנה יופיע כאן, עם ה"למה" שלו.</div>`;
    else body=LINES.map(L=>{const c=COLORS[L.color];const ss=L.stations.filter(S=>learned.includes(S));if(!ss.length)return '';return `<div class="sec" style="--lc:${c}"><h4><i></i>${esc(L.name)} · ${esc(L.he)}</h4>${ss.map(S=>S.teach.map((t,i)=>`<button class="rule" data-rule="${S.id}:${i}"><div class="t"><div>${t.h}</div><div class="st">${esc(S.name)}</div></div></button>`).join('')).join('')}</div>`;}).join('');
  }else{
    const ms=store.mistakes.map(m=>{const S=byId(m.s);return S&&S.ex[m.i]?{S,ex:S.ex[m.i]}:null;}).filter(Boolean);
    if(!ms.length)body=`<div class="empty"><b>אין טעויות פתוחות.</b>כשתטעה בתרגיל הוא ייכנס לכאן, ותשובה נכונה בתרגול תמחק אותו.</div>`;
    else body=`<div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0"><span style="color:var(--muted)">${ms.length} תרגילים לתרגול חוזר</span><button class="btn" style="--lc:var(--violet)" id="prac">תרגל עכשיו</button></div>`+ms.map(m=>`<div class="mist"><div class="he">${esc(m.ex.he||m.ex.fixed||m.ex.q||'')}</div><div class="w">${esc(plain(m.ex.why))}</div><div class="st" style="font-size:.75rem;color:var(--muted);direction:ltr;text-align:start">${esc(m.S.name)}</div></div>`).join('');
  }
  shell(`<div class="tabs" role="tablist"><button role="tab" aria-selected="${tab==='rules'}" data-tab="rules">כללים שלמדתי</button><button role="tab" aria-selected="${tab==='mistakes'}" data-tab="mistakes">טעויות לתרגול${store.mistakes.length?` (${store.mistakes.length})`:''}</button></div><section class="nb">${body}</section>`,'notebook');
  $$('[data-tab]',app).forEach(b=>b.onclick=()=>renderNotebook(b.dataset.tab));
  const p=$('#prac');if(p)p.onclick=()=>go('review',{mistakes:true});
  $$('[data-rule]',app).forEach(b=>b.onclick=()=>{const [sid,i]=b.dataset.rule.split(':');const S=byId(sid),t=S.teach[+i],c=COLORS[S.line.color];
    const rows=(t.c||[]).map(r=>`<div class="r"><div class="c-he">${r[0]}</div><div class="c-lit ${r[1]?'':'none'}">${r[1]||''}</div><div class="c-en"><span>${r[2]}</span>${spkBtn(r[2])}</div></div>`).join('');
    const d=drawer();d.innerHTML=`<div class="in" style="--dc:${c};--lc:${c}"><div class="head"><span class="verdict" style="font-size:1.2rem">${t.h}</span></div><div class="teach"><div class="body">${t.p}</div>${rows?`<div class="contrast"><div class="hd"><div>בעברית</div><div>מילולית ✗</div><div>באנגלית ✓</div></div>${rows}</div>`:''}</div><div class="acts"><button class="btn" id="nextbtn">סגור</button><button class="btn ghost" data-go="${S.id}">לתחנה</button></div></div>`;
    $('#nextbtn',d).onclick=closeDrawer;$('[data-go]',d).onclick=()=>{closeDrawer();go('station',S.id);};setTimeout(()=>d.classList.add('open'),20);});
}

/* ---------- settings ---------- */
function renderSettings(){
  const s=store.settings;
  shell(`<section class="card" style="margin-top:14px">
    <div class="setrow"><div class="l"><b>צלילים</b><span>משוב קולי קצר לתשובות</span></div><button class="switch" role="switch" aria-checked="${s.sound}" data-set="sound" aria-label="צלילים"></button></div>
    <div class="setrow"><div class="l"><b>הקראה באנגלית</b><span>המשפטים הנכונים מוקראים בקול (דורש קול אנגלי במכשיר)</span></div><button class="switch" role="switch" aria-checked="${s.tts}" data-set="tts" aria-label="הקראה"></button></div>
    <div class="setrow"><div class="l"><b>מראה</b><span>בהיר, כהה, או לפי המכשיר</span></div><div class="seg">${[['auto','אוטומטי'],['light','בהיר'],['dark','כהה']].map(([k,v])=>`<button data-theme="${k}" aria-pressed="${s.theme===k}">${v}</button>`).join('')}</div></div>
    <div class="setrow"><div class="l"><b>איפוס התקדמות</b><span>מוחק XP, תחנות שהושלמו ואת המחברת</span></div><button class="btn ghost danger" id="reset">אפס הכול</button></div>
  </section>
  <section class="card" style="color:var(--muted);font-size:.9rem"><b style="color:var(--ink)">איך המשחק בנוי</b><br>${LINES.length} קווים, ${ALL.length} תחנות, ${ALL.reduce((n,S)=>n+S.ex.length,0)} תרגילים. כל תחנה נפתחת בכמה כרטיסי "למה" שמסבירים את ההבדל בין איך שהעברית חושבת לאיך שהאנגלית חושבת, ואז תרגול בשישה סוגי משימות. תשובה נכונה בניסיון ראשון = 10 XP, אחרי החלקה אחת = 5, ורצף של שלוש נכונות מוסיף בונוס. טעויות נאספות במחברת ונמחקות כשעונים נכון בתרגול חוזר. הכול נשמר במכשיר הזה, בלי חשבון ובלי אינטרנט.</section>`,'settings');
  $$('[data-set]',app).forEach(b=>b.onclick=()=>{const k=b.dataset.set;s[k]=!s[k];b.setAttribute('aria-checked',s[k]);save();if(k==='sound'&&s.sound)beep('ok');if(k==='tts'&&s.tts)speak('Grammar Underground');});
  $$('[data-theme]',app).forEach(b=>b.onclick=()=>{s.theme=b.dataset.theme;save();applyTheme();renderSettings();});
  $('#reset').onclick=()=>{if(confirm('לאפס את כל ההתקדמות? אי אפשר לבטל.')){store=JSON.parse(JSON.stringify(DEF));save();applyTheme();toast('ההתקדמות אופסה');go('map');}};
}

/* ---------- boot ---------- */
window.__gu={get cur(){return cur;},get store(){return store;},go};
window.addEventListener('hashchange',()=>{});
go('map');
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();
</script>
</body>
</html>
