}
:root[data-theme="dark"]{
  --bg:#0F1626; --surface:#182136; --surface2:#1F2A44; --surface3:#2A3652;
  --ink:#EAF0FA; --muted:#98A5BF; --hair:#2B3752;
  --amber:#EFB63A;
  --okbg:#173A2C; --badbg:#44202A;
  --shadow:0 10px 30px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;direction:rtl;min-height:100vh;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
b,strong{font-weight:700}
s{opacity:.55}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:500}
.en.bad{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.ltr{direction:ltr;unicode-bidi:isolate}
.sr{position:absolute;left:-9999px}

/* ---------- shell ---------- */
#app{max-width:1080px;margin:0 auto;padding:0 16px 96px}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 0 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.roundel{width:44px;height:44px;flex:none}
.brand h1{font-family:var(--display);font-weight:400;font-size:1.45rem;line-height:1;margin:0;direction:ltr;letter-spacing:.01em}
.brand small{display:block;font-family:var(--body);font-size:.78rem;color:var(--muted);margin-top:3px;letter-spacing:.02em}
.stats{display:flex;gap:8px;margin-inline-start:auto;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--hair);border-radius:999px;padding:5px 12px;font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:16px;height:16px;flex:none}
.chip b{font-weight:700}
.nav{display:flex;gap:4px;background:var(--surface2);border-radius:999px;padding:4px}
.nav button{padding:6px 14px;border-radius:999px;font-size:.9rem;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.nav button:hover{color:var(--ink)}

/* ---------- map ---------- */
.welcome{background:var(--surface);border-radius:var(--r);padding:18px 22px;margin:14px 0;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.welcome h2{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0 0 6px;text-wrap:balance}
.welcome p{margin:0;color:var(--muted);max-width:60ch}
.welcome .go{background:var(--coral);color:#fff;border-radius:999px;padding:12px 22px;font-weight:700;white-space:nowrap;box-shadow:0 6px 18px rgba(232,80,58,.35)}
.welcome .go:hover{filter:brightness(1.05)}
@media (max-width:640px){.welcome{grid-template-columns:1fr}}
.mapwrap{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);margin:14px 0;overflow-x:auto;overflow-y:hidden;position:relative}
.mapwrap svg{display:block;min-width:920px;width:100%;height:auto;direction:ltr}
.mapwrap .legend{position:sticky;left:0;display:flex;gap:14px;flex-wrap:wrap;padding:10px 18px 0;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:50%;display:inline-block;border:3px solid var(--muted);background:var(--surface)}
.legend i.done{background:var(--muted)}
.legend i.lock{opacity:.4;width:10px;height:10px;border-width:2px}
.st{cursor:pointer}
.st:hover .dot{stroke-width:7}
.st.lock{cursor:not-allowed}
.st.lock .dot{opacity:.45}
.st text{font-family:var(--body);fill:var(--ink);pointer-events:none}
.st .lab{font-size:13px;font-weight:500}
.st .labhe{font-size:11px;fill:var(--muted)}
.st.lock text{opacity:.5}
.line-name{font-family:var(--display);font-size:15px;fill:var(--ink);direction:ltr}
.line-name-he{font-family:var(--body);font-size:11px;fill:var(--muted)}
.train{transition:transform .9s cubic-bezier(.4,0,.2,1)}
.st .ring{fill:none;stroke-width:2;opacity:0}
.st.here .ring{opacity:1;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{r:12;opacity:.9}100%{r:26;opacity:0}}

.board{display:grid;gap:12px;margin:14px 0}
.brow{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;border-inline-start:6px solid var(--lc)}
.brow .lhead{min-width:130px}
.brow .lhead .ln{font-family:var(--display);font-size:1.15rem;direction:ltr;text-align:right;color:var(--lc)}
.brow .lhead .lhe{font-size:.85rem;color:var(--muted)}
.brow .lhead .lprog{font-size:.8rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.brow .lblurb{grid-column:1/-1;color:var(--muted);font-size:.9rem;margin:-6px 0 0}
.stations{display:flex;flex-wrap:wrap;gap:8px}
.sch{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--hair);border-radius:10px;padding:7px 12px 7px 10px;background:var(--surface);font-size:.9rem;transition:transform .12s,border-color .12s}
.sch:hover:not(:disabled){transform:translateY(-1px);border-color:var(--lc)}
.sch:disabled{opacity:.45;cursor:not-allowed}
.sch .d{width:12px;height:12px;border-radius:50%;border:3px solid var(--lc);background:var(--surface);flex:none}
.sch.done .d{background:var(--lc)}
.sch.review .d{border-radius:3px}
.sch .n{direction:ltr;font-weight:500}
.sch .nh{color:var(--muted);font-size:.78rem}
.sch .sc{margin-inline-start:4px;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:640px){.brow{grid-template-columns:1fr}.brow .lhead .ln{text-align:start}}

/* ---------- station ---------- */
.shead{border-radius:var(--r);padding:18px 22px 16px;color:#fff;margin:14px 0 0;background:var(--lc);position:relative;overflow:hidden}
.shead::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;border:26px solid rgba(255,255,255,.14)}
.shead .row{display:flex;align-items:center;gap:10px;font-size:.82rem;opacity:.95;flex-wrap:wrap}
.shead .back{background:rgba(255,255,255,.2);border-radius:999px;padding:5px 12px;color:#fff;font-weight:500}
.shead .back:hover{background:rgba(255,255,255,.3)}
.shead h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:10px 0 2px;direction:ltr;text-align:start;line-height:1.05;position:relative}
.shead .he{font-size:1.05rem;font-weight:500;position:relative}
.shead .tag{opacity:.92;font-size:.92rem;margin-top:4px;position:relative;max-width:60ch}
.rail{display:flex;gap:4px;margin:12px 0 0;direction:ltr}
.rail i{flex:1;height:6px;border-radius:3px;background:var(--surface3);position:relative;overflow:hidden}
.rail i.t{background:var(--surface3)}
.rail i.t::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--hair) 0 4px,transparent 4px 8px)}
.rail i.done{background:var(--lc)}
.rail i.cur{background:var(--lc);opacity:.55;animation:pulse 1.2s ease-in-out infinite}
.rail i.miss{background:var(--bad)}
@keyframes pulse{50%{opacity:1}}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px;margin:14px 0;animation:rise .35s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card .kicker{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--lc);font-weight:700;direction:ltr;text-align:start;margin-bottom:6px}
.card .kicker.he{direction:rtl;letter-spacing:0;text-transform:none;font-size:.82rem}
.teach h3{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0 0 10px;line-height:1.2;text-wrap:balance}
.teach .body{font-size:1.05rem;max-width:70ch}
.teach .body .en{background:var(--surface2);padding:0 6px;border-radius:6px;margin:0 1px;line-height:1.5}
.teach .body .en.bad{background:var(--badbg)}
.teach .body u{text-decoration-color:var(--lc);text-decoration-thickness:2px;text-underline-offset:3px}
.contrast{margin-top:16px;border:1px solid var(--hair);border-radius:12px;overflow:hidden}
.contrast .hd,.contrast .r{display:grid;grid-template-columns:1.1fr 1fr 1.3fr;gap:0}
.contrast .hd{background:var(--surface2);font-size:.75rem;letter-spacing:.04em;color:var(--muted);font-weight:700}
.contrast .hd>div,.contrast .r>div{padding:9px 12px;border-inline-start:1px solid var(--hair);min-width:0;word-wrap:break-word}
.contrast .hd>div:first-child,.contrast .r>div:first-child{border-inline-start:0}
.contrast .r{border-top:1px solid var(--hair)}
.contrast .c-he{font-weight:500}
.contrast .c-lit{direction:ltr;text-align:left;color:var(--bad);font-family:var(--mono);font-size:.9rem}
.contrast .c-lit:empty::before,.contrast .c-lit.none::before{content:"—";color:var(--muted)}
.contrast .c-en{direction:ltr;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px}
.contrast .c-en b{color:var(--lc)}
@media (max-width:560px){.contrast .hd{display:none}.contrast .r{grid-template-columns:1fr}.contrast .r>div{border-inline-start:0;padding:6px 12px}.contrast .r>div:first-child{padding-top:10px}.contrast .r>div:last-child{padding-bottom:10px}}
.spk{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none;transition:background .15s,color .15s}
.spk:hover{background:var(--surface2);color:var(--ink)}
.spk svg{width:18px;height:18px}
.spk.on{color:var(--lc)}
.tip{margin-top:14px;padding:10px 14px;border-inline-start:4px solid var(--lc);background:var(--surface2);border-radius:8px;font-size:.95rem}
.tip b{color:var(--lc)}

/* exercise */
.ex .prompt{margin-bottom:16px}
.ex .task{font-size:.85rem;color:var(--muted);margin-bottom:8px}
.ex .he{font-size:1.25rem;font-weight:500;margin-bottom:6px}
.ex .q{direction:ltr;text-align:left;font-size:1.35rem;line-height:1.5;font-weight:500}
.ex .q .blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--lc);margin:0 4px;text-align:center;color:var(--lc);transition:all .2s}
.ex .q .blank.filled{border-bottom-color:transparent;background:var(--okbg);border-radius:6px;padding:0 8px;color:var(--ok)}
.fig{margin:12px 0 4px;direction:ltr}
.fig svg{width:100%;max-width:380px;height:auto;display:block}
.opts{display:grid;gap:10px;direction:ltr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border:2px solid var(--hair);border-radius:12px;background:var(--surface);font-size:1.08rem;transition:border-color .15s,transform .12s,background .15s}
.opt:hover:not(:disabled){border-color:var(--lc);transform:translateY(-1px)}
.opt kbd{font-family:var(--mono);font-size:.75rem;width:22px;height:22px;border-radius:6px;border:1px solid var(--hair);display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg);animation:shake .4s}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.note{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--badbg);color:var(--ink);font-size:.95rem;animation:rise .25s}
.note.soft{background:var(--surface2)}
.note b{color:var(--bad)}

.answer{direction:ltr;min-height:64px;border:2px dashed var(--hair);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;transition:border-color .2s}
.answer:empty::before{content:attr(data-ph);color:var(--muted);font-size:.9rem;padding:4px 6px}
.answer.ok{border-color:var(--ok);border-style:solid;background:var(--okbg)}
.answer.bad{border-color:var(--bad)}
.bank{direction:ltr;display:flex;flex-wrap:wrap;gap:8px;min-height:48px}
.tile{padding:9px 14px;border-radius:10px;background:var(--surface2);border:1.5px solid transparent;font-size:1.08rem;font-weight:500;direction:ltr;box-shadow:0 2px 0 var(--surface3);transition:transform .12s,background .15s;animation:pop .2s}
.tile:hover{transform:translateY(-2px)}
.tile.ghost{opacity:.25;pointer-events:none;box-shadow:none}
.tile.wrong{background:var(--badbg);border-color:var(--bad);animation:shake .4s}
.tile.right{background:var(--okbg);border-color:var(--ok)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}

.sent{direction:ltr;display:flex;flex-wrap:wrap;gap:8px;font-size:1.3rem;margin-bottom:14px}
.tok{padding:6px 10px;border-radius:10px;border:2px solid transparent;font-weight:500;transition:all .15s}
.tok:hover{background:var(--surface2)}
.tok.picked{border-color:var(--bad);background:var(--badbg);text-decoration:line-through;text-decoration-thickness:2px}
.tok.miss{animation:shake .4s;background:var(--surface2)}
.tok.hint{border-color:var(--amber);border-style:dashed}
.tok.fixed{border-color:var(--ok);background:var(--okbg);text-decoration:none}
.sub{font-size:.9rem;color:var(--muted);margin:8px 0}

.sortwrap{display:grid;gap:14px}
.deck{display:flex;justify-content:center;min-height:96px;position:relative}
.scard{background:var(--surface2);border-radius:14px;padding:20px 28px;font-size:1.4rem;font-weight:500;direction:ltr;box-shadow:var(--shadow);animation:pop .25s;min-width:180px;text-align:center}
.scard.he{direction:rtl;font-size:1.2rem}
.scard.wrong{animation:shake .4s;background:var(--badbg)}
.scard.fly{transition:transform .35s cubic-bezier(.4,0,.6,1),opacity .35s;opacity:0}
.buckets{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:10px;direction:ltr}
.bucket{border:2px solid var(--hair);border-radius:12px;padding:14px 8px;text-align:center;font-weight:700;font-size:1.05rem;background:var(--surface);transition:border-color .15s,background .15s,transform .12s;position:relative}
.bucket:hover:not(:disabled){border-color:var(--lc);transform:translateY(-2px)}
.bucket .cnt{position:absolute;top:-10px;right:-6px;background:var(--lc);color:#fff;font-size:.7rem;border-radius:999px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;font-variant-numeric:tabular-nums}
.bucket.ok{border-color:var(--ok);background:var(--okbg)}
.bucket.bad{border-color:var(--bad);background:var(--badbg);animation:shake .4s}
.bucket .items{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:8px;min-height:18px}
.bucket .items span{font-size:.72rem;font-weight:500;color:var(--muted);background:var(--surface2);padding:2px 6px;border-radius:6px;direction:ltr}
.sortdone{text-align:center;color:var(--muted);padding:12px}

.typ{direction:ltr;text-align:left;font-size:1.35rem;line-height:2;font-weight:500}
.typ input{font:inherit;font-size:1.15rem;width:11em;max-width:100%;border:0;border-bottom:3px solid var(--lc);background:var(--surface2);border-radius:8px 8px 0 0;padding:4px 10px;color:var(--ink);direction:ltr;text-align:center;vertical-align:baseline}
.typ input.ok{border-bottom-color:var(--ok);background:var(--okbg)}
.typ input.bad{border-bottom-color:var(--bad);background:var(--badbg);animation:shake .4s}

.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;direction:ltr}
.match .col{display:grid;gap:8px;align-content:start}
.mi{padding:12px 14px;border:2px solid var(--hair);border-radius:12px;background:var(--surface);font-size:1.05rem;text-align:center;transition:all .15s;font-weight:500}
.mi.he{direction:rtl}
.mi:hover:not(:disabled){border-color:var(--lc)}
.mi.sel{border-color:var(--lc);background:var(--surface2);transform:scale(1.02)}
.mi.bad{border-color:var(--bad);background:var(--badbg);animation:shake .4s}
.mi.lock{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 16%,var(--surface));color:var(--ink);cursor:default}
.mi:disabled{cursor:default}

/* footer / drawer */
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--hair);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -8px 24px rgba(0,0,0,.06)}
.foot .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px}
.foot .msg{color:var(--muted);font-size:.9rem;flex:1}
.btn{border-radius:999px;padding:12px 24px;font-weight:700;font-size:1rem;background:var(--lc,var(--ink));color:#fff;transition:transform .12s,filter .15s,opacity .15s;white-space:nowrap}
.btn:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--hair)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:30;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.drawer.open{transform:none;pointer-events:auto}
.drawer .in{max-width:1080px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.18);border-top:6px solid var(--dc);max-height:70vh;overflow:auto;padding:16px 22px calc(18px + env(safe-area-inset-bottom))}
.drawer .head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.drawer .verdict{font-family:var(--display);font-size:1.5rem;color:var(--dc)}
.drawer .vicon{width:34px;height:34px;border-radius:50%;background:var(--dc);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.drawer .vicon svg{width:20px;height:20px}
.drawer .xp{margin-inline-start:auto;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.drawer .xp b{color:var(--dc)}
.drawer .whyk{font-size:.75rem;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-top:6px}
.drawer .why{font-size:1.05rem;max-width:70ch}
.drawer .corr{direction:ltr;text-align:left;margin:10px 0 4px;padding:10px 14px;border-radius:10px;background:var(--surface2);font-size:1.15rem;font-weight:500;display:flex;align-items:center;justify-content:space-between;gap:10px}
.drawer .wn{margin-top:8px;padding:8px 12px;border-radius:8px;background:var(--badbg);font-size:.95rem}
.drawer .acts{display:flex;gap:10px;margin-top:14px;align-items:center}
.drawer .acts .btn{background:var(--dc)}

/* summary */
.sum{text-align:center;padding:30px 20px}
.sum .stamp{display:inline-block;border:4px solid var(--lc);color:var(--lc);border-radius:10px;padding:8px 18px;font-family:var(--display);font-size:1.6rem;letter-spacing:.06em;transform:rotate(-6deg);direction:ltr;animation:stamp .6s cubic-bezier(.2,1.4,.4,1);margin-bottom:14px;text-transform:uppercase}
.sum .stamp small{display:block;font-family:var(--body);font-size:.8rem;letter-spacing:0;text-transform:none;direction:rtl}
@keyframes stamp{0%{transform:rotate(-20deg) scale(2.2);opacity:0}60%{opacity:1}100%{transform:rotate(-6deg) scale(1)}}
.sum h3{font-family:var(--display);font-weight:400;font-size:1.7rem;margin:6px 0}
.sum .nums{display:flex;gap:26px;justify-content:center;margin:14px 0 4px;font-variant-numeric:tabular-nums}
.sum .nums div{display:grid}
.sum .nums b{font-size:1.9rem;font-family:var(--display);font-weight:400;line-height:1}
.sum .nums span{font-size:.8rem;color:var(--muted)}
.sum .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.sum .mis{max-width:60ch;margin:18px auto 0;text-align:start;font-size:.95rem}
.sum .mis li{margin-bottom:6px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* notebook */
.tabs{display:flex;gap:6px;margin:14px 0 0}
.tabs button{padding:8px 16px;border-radius:999px;background:var(--surface2);color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.nb .sec{margin:12px 0}
.nb h4{font-family:var(--display);font-weight:400;font-size:1.05rem;margin:0 0 8px;display:flex;align-items:center;gap:8px;direction:ltr;text-align:start}
.nb h4 i{width:12px;height:12px;border-radius:50%;background:var(--lc);display:inline-block}
.rule{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--surface);margin-bottom:6px;border:1px solid var(--hair);text-align:start;width:100%}
.rule:hover{border-color:var(--lc)}
.rule .t{flex:1}
.rule .st{font-size:.75rem;color:var(--muted);direction:ltr;text-align:start}
.mist{padding:12px 14px;border-radius:10px;background:var(--surface);margin-bottom:8px;border:1px solid var(--hair);border-inline-start:4px solid var(--bad)}
.mist .he{font-weight:500}
.mist .w{font-size:.92rem;color:var(--muted);margin-top:4px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);background:var(--surface);border-radius:var(--r);margin-top:12px}
.empty b{display:block;font-family:var(--display);font-weight:400;font-size:1.3rem;color:var(--ink);margin-bottom:6px}

/* settings */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--hair)}
.setrow:last-child{border-bottom:0}
.setrow .l b{display:block}
.setrow .l span{font-size:.85rem;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px}
.seg button{padding:6px 12px;border-radius:999px;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.switch{width:46px;height:26px;border-radius:999px;background:var(--surface3);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.danger{color:var(--bad);border-color:var(--bad)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;transition:all .3s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.combo{position:fixed;top:14px;left:50%;transform:translateX(-50%) scale(.6);background:var(--amber);color:#1a1200;font-family:var(--display);padding:6px 16px;border-radius:999px;opacity:0;z-index:60;pointer-events:none;transition:all .25s;direction:ltr}
.combo.show{opacity:1;transform:translateX(-50%) scale(1)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (max-width:640px){
  #app{padding:0 10px 100px}
  .card{padding:18px 16px}
  .shead h2{font-size:1.6rem}
  .ex .q{font-size:1.2rem}
  .match{gap:8px 10px}
  .mi{padding:10px 8px;font-size:.98rem}
  .brand h1{font-size:1.2rem}
  .stats .chip{font-size:.78rem;padding:4px 10px}
}

<div id="app" lang="he"></div>
<script>// ===== Grammar Underground — curriculum, lines 1–2 =====
const LINES = [];

LINES.push({
id:'found', name:'Foundations', he:'יסודות', color:'coral',
blurb:'הדברים שבעברית פשוט לא קיימים — ולכן נעלמים לנו באנגלית.',
stations:[
{ id:'be', name:'I am', he:'הפועל to be', tag:'למה באנגלית אי אפשר להגיד "אני רופא" בלי פועל',
teach:[
 {h:'בעברית אין "להיות" בהווה. באנגלית — חובה.',
  p:`בעברית אומרים <b>אני רופא</b>, <b>הוא בבית</b>, <b>הם עייפים</b> — משפט בלי פועל בכלל (משפט שמני). באנגלית זה בלתי אפשרי: <b>כל משפט חייב פועל</b>. כשאין פעולה, הפועל הוא <span class="en">am / is / are</span> — צורות ההווה של <span class="en">to be</span>.`,
  c:[['אני רופא.','I doctor.','I <b>am</b> a doctor.'],['הוא בבית.','He at home.','He <b>is</b> at home.'],['הם חברים.','They friends.','They <b>are</b> friends.']],
  tip:'הסיבה: הזמן (הווה/עבר) באנגלית יושב על הפועל. בלי פועל — המשפט "לא יודע" באיזה זמן הוא.'},
 {h:'שלוש צורות — ואין בזה היגיון, רק היסטוריה',
  p:`<span class="en">I <b>am</b></span> · <span class="en">you <b>are</b></span> · <span class="en">he / she / it <b>is</b></span> · <span class="en">we / they <b>are</b></span>.<br>אלה שרידים מאנגלית עתיקה, שבה כל פועל השתנה לפי גוף (כמו עברית). כמעט הכול נשחק — חוץ מ-<span class="en">to be</span>. פשוט לשנן.<br>בדיבור מקצרים: <span class="en">I'm, you're, he's, she's, it's, we're, they're</span>.`,
  c:[['אני עייף.','','I<b>\'m</b> tired.'],['את צודקת.','','You<b>\'re</b> right.'],['היא כאן.','','She<b>\'s</b> here.']]},
 {h:'גיל, מזג אוויר, מיקום, הרגשה — הכול עם to be',
  p:`בעברית: <b>אני בן 30</b>, <b>קר</b>, <b>מאוחר</b>. באנגלית כל אלה מצבים, ומצב מתואר עם <span class="en">be</span>: <span class="en">I <b>am</b> 30</span>, <span class="en">it <b>is</b> cold</span>, <span class="en">it <b>is</b> late</span>.<br>שלילה: <span class="en">not</span> מיד אחרי הפועל — <span class="en">I am <b>not</b> hungry</span>. בלי <span class="en">don't</span>!`,
  c:[['אני בן שלושים.','I have 30 years.','I <b>am</b> 30 (years old).'],['אני לא רעב.',"I don't hungry.",'I am <b>not</b> hungry.'],['קר היום.','Cold today.','It <b>is</b> cold today.']]},
 {h:'המלכודת ההפוכה: "I\'m agree"',
  p:`בעברית <b>מסכים</b> מרגיש כמו תואר (אני מסכים / אני שמח). באנגלית <span class="en">agree</span> הוא <b>פועל</b> — ולכן לא צריך <span class="en">am</span> לפניו. <span class="en">I <b>agree</b></span>, לא <span class="en bad">I'm agree</span>.<br>הכלל: אם המילה היא פועל — היא לבד. אם היא תואר / שם / מקום — צריך <span class="en">be</span>.`,
  c:[['אני מסכים.',"I'm agree.",'I <b>agree</b>.'],['אני מרגיש טוב.',"I'm feel good.",'I <b>feel</b> good.'],['אני מוכן.','I ready.','I <b>am</b> ready.']]}
],
ex:[
 {t:'choice', he:'אני סטודנט.', q:'I ___ a student.', opts:['am','is','are','(כלום)'], a:0,
  why:'בעברית "אני סטודנט" בלי פועל. באנגלית חייב פועל, ולגוף ראשון יחיד הפועל הוא am.', wrong:{3:'משפט באנגלית בלי פועל הוא לא משפט — המילה am היא הפועל.',1:'is הולך רק עם he / she / it.',2:'are הולך עם you / we / they.'}},
 {t:'choice', he:'היא עייפה.', q:'She ___ tired.', opts:['is','am','are'], a:0, why:'she = גוף שלישי יחיד → is. "עייפה" הוא תואר, ותואר תמיד צריך be לפניו.'},
 {t:'build', he:'הם בבית.', words:['They','are','at','home'], extra:['is','in'], why:'"בבית" = at home (בלי the!). they → are. בעברית אין פועל כאן — באנגלית are הוא הלב של המשפט.'},
 {t:'fix', toks:["I'm",'agree','with','you.'], bad:0, opts:['I','I am','Me'], a:0, fixed:'I agree with you.', why:'agree הוא פועל, לא תואר. פועל לא צריך am לפניו. בעברית "מסכים" מרגיש כמו תואר — וזה מקור הבלבול.'},
 {t:'sort', buckets:['am','is','are'], items:[['I',0],['he',1],['they',2],['she',1],['we',2],['you',2],['it',1],['the dog',1],['my parents',2]], why:'am רק ל-I. is לכל יחיד שלישי (he, she, it, וכל שם עצם יחיד). are לכל השאר — כולל you ביחיד!'},
 {t:'type', he:'ההורים שלי מחיפה.', q:'My parents ___ from Haifa.', a:['are'], why:'parents = רבים → are. "מחיפה" הוא מיקום / מוצא, ומצב כזה מתואר עם be.'},
 {t:'choice', he:'קר היום.', q:'___ cold today.', opts:['It is','Is','Have','Cold is'], a:0, why:'בעברית "קר" זה משפט שלם. באנגלית צריך גם נושא וגם פועל — It (נושא ריק) + is.', wrong:{1:'Is לבד זה שאלה. חסר נושא.',2:'קור הוא מצב, לא רכוש. לא have.'}},
 {t:'build', he:'אני לא רעב.', words:['I','am','not','hungry'], extra:["don't",'no'], why:'שלילה של be: not מיד אחרי am/is/are. don\'t שייך רק לפעלים רגילים (I don\'t eat).'},
 {t:'match', pairs:[['אני','I am'],['את / אתה','you are'],['הוא','he is'],['אנחנו','we are'],['הן','they are'],['זה','it is']], why:'שימו לב: אין הבדל בין זכר לנקבה (הם / הן = they), ואין הבדל בין את / אתה / אתם (you).'}
]},

{ id:'articles', name:'a / an / the', he:'תוויות היידוע', tag:'בעברית יש רק ה׳. באנגלית יש שלושה מצבים',
teach:[
 {h:'בעברית: ה׳ או כלום. באנגלית: שלוש אפשרויות',
  p:`<span class="en"><b>a / an</b></span> = אחד מתוך רבים, לא ידוע, מוזכר לראשונה.<br><span class="en"><b>the</b></span> = ה׳ הידיעה: שנינו יודעים על מה מדובר.<br><b>כלום</b> = הכללה עם רבים או שם לא-ספיר (<span class="en">Dogs are loyal. Water is life.</span>)<br>למה? אנגלית מסמנת בכל שם עצם אם המידע <b>חדש</b> או <b>ידוע</b> לשומע. עברית לא מסמנת "חדש".`,
  c:[['קניתי מכונית.','I bought car.','I bought <b>a</b> car.'],['המכונית אדומה.','','<b>The</b> car is red.'],['אני אוהב מכוניות.','I love the cars.','I love cars.']]},
 {h:'a או an? לפי הצליל, לא לפי האות',
  p:`<span class="en">an</span> מגיע לפני <b>צליל</b> תנועה: <span class="en">an apple, an hour</span> (ה-h שקטה!), <span class="en">an honest man</span>.<br><span class="en">a</span> לפני צליל עיצור: <span class="en">a university</span> (נשמע "יו"), <span class="en">a European, a one-way street</span> (נשמע "וואן").<br>הסיבה: שתי תנועות רצופות קשות להגייה, אז ה-n נכנס כגשר.`,
  c:[['שעה','a hour','<b>an</b> hour'],['אוניברסיטה','an university','<b>a</b> university'],['תפוח','a apple','<b>an</b> apple']]},
 {h:'הכללות: בעברית עם ה׳, באנגלית בלי',
  p:`<b>החיים יפים</b> → <span class="en">Life is beautiful</span>. <b>הכלבים נאמנים</b> → <span class="en">Dogs are loyal</span>.<br>למה? <span class="en">the</span> באנגלית מצביע על דבר <b>ספציפי</b>. כשמדברים על "החיים בכלל" אין דבר ספציפי — ולכן אין the. עברית משתמשת בה׳ גם להכללה, וזה מקור הטעות.`,
  c:[['החיים קצרים.','The life is short.','Life is short.'],['אני אוהב מוזיקה.','I love the music.','I love music.'],['הילדים אוהבים שוקולד.','','Children love chocolate.']]},
 {h:'שם עצם יחיד ספיר לא עומד לבד',
  p:`<span class="en bad">I have car</span> ✗. שם עצם יחיד שאפשר לספור חייב משהו לפניו: <span class="en">a car / the car / my car / this car</span>.<br><b>בלי תווית:</b> שמות, שפות, ארוחות, רוב המדינות (<span class="en">Israel, English, breakfast</span>).<br><b>עם the:</b> דברים יחידים בעולם (<span class="en">the sun, the internet</span>), נהרות וימים, סופרלטיב (<span class="en">the best</span>), מדינות ברבים (<span class="en">the USA</span>).`,
  c:[['יש לי כלב.','I have dog.','I have <b>a</b> dog.'],['השמש זורחת.','','<b>The</b> sun rises.'],['אני מדבר עברית.','I speak the Hebrew.','I speak Hebrew.']]}
],
ex:[
 {t:'sort', buckets:['a','an'], items:[['apple',1],['hour',1],['university',0],['egg',1],['honest man',1],['European',0],['umbrella',1],['uniform',0],['orange',1],['house',0]], why:'הכלל הוא צליל: hour ו-honest מתחילים בתנועה (h שקטה) → an. university, uniform, European מתחילים בצליל "יו" (עיצור) → a.'},
 {t:'choice', he:'החיים יפים.', q:'___ life is beautiful.', opts:['(כלום)','The','A'], a:0, why:'הכללה על "החיים" בכלל — אין דבר ספציפי, אז אין the. בעברית ה׳ משמשת גם להכללה, באנגלית לא.', wrong:{1:'The life = חיים מסוימים (the life of a soldier). כאן מדובר בחיים בכלל.'}},
 {t:'choice', he:'קניתי מכונית אתמול. המכונית אדומה.', q:'I bought ___ car yesterday. ___ car is red.', opts:['a / The','the / A','a / A','the / The'], a:0, why:'אזכור ראשון = חדש לשומע → a. אזכור שני = כבר ידוע → the. זה כל הסיפור של a/the: חדש מול ידוע.'},
 {t:'fix', toks:['I','have','dog.'], bad:2, opts:['a dog.','the dog.','dogs.'], a:0, fixed:'I have a dog.', why:'שם עצם יחיד ספיר (dog) לא יכול לעמוד לבד. כלב אחד, לא ידוע לשומע → a dog. (dogs היה תקין דקדוקית, אבל משנה את המשמעות.)'},
 {t:'build', he:'השמש זורחת במזרח.', words:['The','sun','rises','in','the','east'], extra:['a','Sun'], why:'יש שמש אחת ומזרח אחד — דברים יחידים בעולם מקבלים the. שימו לב גם ל-s של גוף שלישי: rises.'},
 {t:'type', he:'היא אדם ישר.', q:'She is ___ honest person.', a:['an'], why:'honest נשמע "אונסט" — ה-h שקטה, המילה מתחילה בצליל תנועה → an.'},
 {t:'choice', he:'אני אוהב מוזיקה.', q:'I love ___ music.', opts:['(כלום)','the','a'], a:0, why:'music = שם לא-ספיר, ומדובר על מוזיקה בכלל → בלי תווית. the music = מוזיקה ספציפית (the music in this film).'},
 {t:'choice', he:'הוא השחקן הכי טוב בקבוצה.', q:'He is ___ best player in ___ team.', opts:['the / the','a / the','the / a','(כלום) / the'], a:0, why:'סופרלטיב (best) תמיד עם the — יש רק אחד הכי טוב. "הקבוצה" ידועה לשנינו → the team.'},
 {t:'match', pairs:[['ילדים אוהבים שוקולד','Children love chocolate.'],['הילדים בגן','The children are at kindergarten.'],['ילד (כלשהו)','a child'],['שעה אחת','an hour'],['אני מדבר עברית','I speak Hebrew.'],['השמש','the sun']], why:'הכללה (ילדים בכלל) → בלי תווית. קבוצה ידועה (הילדים שלנו) → the. שפות ושמות → כלום. יחיד בעולם → the.'}
]},

{ id:'order', name:'Word order', he:'סדר מילים', tag:'בית גדול הופך ל-big house: התואר קופץ קדימה',
teach:[
 {h:'התואר לפני שם העצם — תמיד',
  p:`בעברית: <b>בית גדול</b>. באנגלית: <span class="en">a <b>big</b> house</span>. הסדר הפוך, בלי יוצאים מן הכלל.<br>למה? באנגלית שם העצם הוא "הראש" של הביטוי, וכל מה שמתאר אותו בא <b>לפניו</b>: <span class="en">a big red wooden house</span>. בעברית הראש בא ראשון והתיאורים אחריו.`,
  c:[['בית גדול','a house big','a <b>big</b> house'],['ילדה חכמה','a girl smart','a <b>smart</b> girl'],['קפה חם','coffee hot','<b>hot</b> coffee']]},
 {h:'התואר לא משתנה. אף פעם.',
  p:`בעברית: ילד קטן / ילד<b>ה</b> קטנ<b>ה</b> / ילד<b>ים</b> קטנ<b>ים</b>. באנגלית: <span class="en">small boy / small girl / small boys</span>. אין מין, אין רבים על תארים.<br>אנגלית איבדה את ההתאמה הזאת לפני כ-800 שנה. זה חוסך המון — רק צריך לזכור <b>לא</b> להוסיף s.`,
  c:[['ילדים קטנים','smalls children','<b>small</b> children'],['מכוניות אדומות','reds cars','<b>red</b> cars'],['נשים חזקות','strongs women','<b>strong</b> women']]},
 {h:'סדר המשפט נוקשה: מי – עושה – מה – איפה – מתי',
  p:`בעברית אפשר: "אתמול אכלתי תפוח" / "אכלתי אתמול תפוח" / "תפוח אכלתי אתמול". באנגלית יש סדר אחד: <span class="en"><b>S</b>ubject – <b>V</b>erb – <b>O</b>bject – Place – Time</span>:<br><span class="en">I ate an apple at home yesterday.</span><br>למה נוקשה? בעברית יש סימנים (את, ל, ב) שמסמנים מי הפועל ומי המושא. באנגלית אין — <b>הסדר הוא הסימן</b>. <span class="en">The dog bit the man</span> ≠ <span class="en">The man bit the dog</span>.`,
  c:[['אתמול ראיתי סרט.','Yesterday I saw movie.','I saw a movie yesterday.'],['בבית אני אוכל ארוחת ערב.','','I eat dinner at home.']]},
 {h:'מילות תדירות: לפני הפועל, אחרי be',
  p:`<span class="en">always, usually, often, sometimes, never</span> יושבות <b>לפני הפועל הרגיל</b>: <span class="en">I <b>always</b> drink coffee</span>.<br>אבל <b>אחרי</b> <span class="en">be</span>: <span class="en">He is <b>always</b> late</span>.<br>כשיש כמה תארים, האנגלית מסדרת אותם: דעה – גודל – גיל – צורה – צבע – מוצא – חומר: <span class="en">a beautiful old round Italian wooden table</span>. דוברי אנגלית לא לומדים את זה — הם פשוט "שומעים" שזה נכון.`,
  c:[['אני תמיד שותה קפה.','I drink always coffee.','I <b>always</b> drink coffee.'],['הוא תמיד מאחר.','He always is late.','He is <b>always</b> late.']]}
],
ex:[

{ id:'have', name:'I have', he:'יש לי = I have', tag:'בעברית הדבר הוא הנושא. באנגלית — אני',
teach:[
 {h:'"יש לי" הוא משפט הפוך',
  p:`בעברית: <b>יש לי ספר</b> — מילולית "קיים, אליי, ספר". הספר הוא הנושא, ואני רק "כתובת".<br>באנגלית יש פועל בעלות אמיתי: <span class="en">I <b>have</b> a book</span>. <b>אני</b> הנושא, <span class="en">have</span> הפועל, הספר המושא. כלומר: לתרגם "יש לי" = לסובב את המשפט.`,
  c:[['יש לי ספר.','There is to me a book.','I <b>have</b> a book.'],['יש לה שני אחים.','','She <b>has</b> two brothers.'],['יש לנו זמן.','','We <b>have</b> time.']]},
 {h:'אין לי · יש לך? · היה לי',
  p:`<span class="en">have</span> הוא פועל רגיל, ולכן שלילה ושאלה עם <span class="en">do</span>:<br><b>אין לי</b> → <span class="en">I <b>don't have</b></span> (או <span class="en">I have no…</span>)<br><b>יש לך?</b> → <span class="en"><b>Do you have</b>…?</span><br><b>היה לי / לא היה לי</b> → <span class="en">I <b>had</b> / I <b>didn't have</b></span>.<br>גוף שלישי יחיד: <span class="en">he <b>has</b></span> (לא haves).`,
  c:[['אין לי כסף.',"I haven't money.",'I <b>don\'t have</b> money.'],['יש לך עט?','You have a pen?','<b>Do you have</b> a pen?'],['לא היה לנו זמן.','We hadn\'t time.','We <b>didn\'t have</b> time.']]},
 {h:'have גם לדברים שבעברית עושים אחרת',
  p:`<span class="en">have breakfast</span> (לאכול ארוחת בוקר), <span class="en">have fun</span> (ליהנות), <span class="en">have a good time</span>, <span class="en">have a shower</span> (בריטי), <span class="en">have a look</span> (להעיף מבט), <span class="en">have a baby</span> (ללדת).<br>אבל גיל — <b>לא</b> עם have: <b>אני בן 30</b> → <span class="en">I <b>am</b> 30</span>. גיל באנגלית הוא מצב, לא רכוש.`,

],

{ id:'dummy', name:'It is / There is', he:'הנושא הריק', tag:'"יורד גשם" ו"יש בעיה": מאיפה מגיעים it ו-there',
teach:[
 {h:'לכל משפט באנגלית חייב להיות נושא — גם כשאין',
  p:`בעברית: <b>יורד גשם</b>, <b>קר</b>, <b>מאוחר</b>, <b>חשוב ללמוד</b>. מי קר? אף אחד. באנגלית הפועל לא יכול לעמוד בלי מישהו לפניו, אז נכנס נושא-דמה: <span class="en"><b>It</b> is raining. <b>It</b> is cold. <b>It</b> is late.</span><br>ה-<span class="en">it</span> הזה לא מצביע על כלום. הוא פשוט ממלא את הכיסא.`,
  c:[['יורד גשם.','Rain falls.','<b>It</b> is raining.'],['מאוחר.','Is late.','<b>It</b> is late.'],['חשוב ללמוד.','Important to learn.','<b>It</b> is important to learn.']]},
 {h:'"יש" = There is / There are',
  p:`<b>יש</b> במובן "קיים" → <span class="en"><b>There is</b></span> (יחיד) / <span class="en"><b>There are</b></span> (רבים).<br><span class="en">There is a book on the table. There are many people here.</span><br>ההבדל מ-<span class="en">It is</span>: <span class="en">There</span> אומר <b>שמשהו קיים</b>; <span class="en">It</span> אומר <b>מה משהו הוא / איך המצב</b>.<br><span class="en">There is a problem</span> (יש בעיה) ≠ <span class="en">It is a problem</span> (זו בעיה).`,
  c:[['יש בעיה.','It is a problem.','<b>There is</b> a problem.'],['יש הרבה אנשים.','There is many people.','<b>There are</b> many people.'],['אין חלב.','','<b>There is no</b> milk.']]},
 {h:'המילה "יש" מתפצלת לשלוש',
  p:`<b>יש ספר</b> (קיום) → <span class="en">There is a book</span><br><b>יש לי ספר</b> (בעלות) → <span class="en">I have a book</span><br><b>יש!</b> (הצלחה) → <span class="en">Yes!</span><br>וגם "קשה / קל / חשוב / אפשר + לעשות" → <span class="en">It is hard / easy / important / possible <b>to</b> do</span>. העברית מתחילה מהתואר; האנגלית חייבת It is לפניו.`,
  c:[['קשה ללמוד עברית.','Hard to learn Hebrew.','<b>It is</b> hard to learn Hebrew.'],['אפשר לשלם בכרטיס?','Possible to pay by card?','<b>Is it</b> possible to pay by card?']]}
],

{ id:'thirds', name:'He works', he:'ה-s של גוף שלישי', tag:'השריד האחרון של הטיית הפעלים באנגלית',

  c:[['הוא עובד בחיפה.','He work in Haifa.','He work<b>s</b> in Haifa.'],['היא אוהבת פיצה.','She love pizza.','She love<b>s</b> pizza.'],['ההורים שלי גרים כאן.','My parents lives here.','My parents live here.']]},
 {h:'כתיב: -s, -es, -ies',
  p:`רגיל: <span class="en">work<b>s</b>, play<b>s</b></span><br>אחרי s / sh / ch / x / o: <span class="en">watch<b>es</b>, wash<b>es</b>, go<b>es</b>, do<b>es</b>, fix<b>es</b></span> (כי אי אפשר להגות "watchs")<br>עיצור + y → ies: <span class="en">study → stud<b>ies</b>, fly → fl<b>ies</b></span>. אבל תנועה + y נשאר: <span class="en">plays, enjoys</span>.<br>ומיוחד: <span class="en">have → <b>has</b></span>.`,
  c:[['היא לומדת','she studys','she stud<b>ies</b>'],['הוא הולך','he gos','he go<b>es</b>'],['יש לו','he haves','he <b>has</b>']]},
 {h:'ה-s עובר ל-does בשאלה ובשלילה',
  p:`<span class="en">He work<b>s</b></span> → <span class="en"><b>Does</b> he work?</span> → <span class="en">He <b>doesn't</b> work.</span><br>הפועל חוזר לצורת הבסיס! למה? כי סימן הזמן והגוף (ה-s) עבר ל-<span class="en">does</span>. יש רק s <b>אחת</b> בכל צירוף פועל — לא <span class="en bad">Does he works</span>.`,
  c:[['הוא לא אוהב דגים.',"He doesn't likes fish.",'He doesn\'t <b>like</b> fish.'],['היא גרה כאן?','Does she lives here?','Does she <b>live</b> here?']]}
],
ex:[
 {t:'type', he:'היא לומדת אנגלית.', q:'She ___ (study) English.', a:['studies'], why:'she → s. עיצור (d) + y → הופך ל-ies: studies.'},
 {t:'choice', he:'הוא צופה בטלוויזיה כל ערב.', q:'He ___ TV every night.', opts:['watches','watch','watching'], a:0, why:'הרגל + he → הווה פשוט עם s. אחרי ch מוסיפים es: watches.'},
 {t:'fix', toks:['My brother',"don't",'like','fish.'], bad:1, opts:["doesn't","isn't","not"], a:0, fixed:"My brother doesn't like fish.", why:'my brother = he → doesn\'t. ושימו לב: like נשאר בלי s, כי ה-s כבר יושבת על does.'},
 {t:'type', he:'זה נוסע מהר.', q:'It ___ (go) fast.', a:['goes'], why:'it → s. אחרי o מוסיפים es: goes (וגם does).'},
 {t:'sort', buckets:['-s','-es','-ies'], items:[['work',0],['watch',1],['go',1],['study',2],['play',0],['fix',1],['fly',2],['eat',0],['wash',1]], why:'es אחרי צלילים שורקים (ch, sh, s, x) ואחרי o. ies כשיש עיצור לפני ה-y. play = תנועה לפני y → plays.'},
 {t:'choice', he:'היא גרה כאן?', q:'Does she ___ here?', opts:['live','lives','living'], a:0, why:'ה-s כבר על Does. הפועל הראשי חוזר לבסיס: live. s אחת בלבד לכל צירוף.'},
 {t:'build', he:'אחותי גרה בתל אביב.', words:['My','sister','lives','in','Tel Aviv'], extra:['live','living'], why:'my sister = she → lives. מצב קבוע → הווה פשוט, לא ממושך.'},
 {t:'choice', he:'ההורים שלי גרים בחיפה.', q:'My parents ___ in Haifa.', opts:['live','lives','is living'], a:0, why:'parents = they → בלי s. ה-s היא רק ליחיד שלישי. רבים = צורת בסיס.'}
]},

{ id:'past', name:'Went', he:'עבר פשוט', tag:'צורה אחת לכל הגופים, ורשימת יוצאי דופן',
teach:[
 {h:'עבר רגיל: -ed. לכולם אותה צורה',
  p:`בעברית העבר מוטה לפי גוף: הלכ<b>תי</b> / הלכ<b>ת</b> / הלכ<b>נו</b>. באנגלית צורה אחת: <span class="en">I walk<b>ed</b>, you walk<b>ed</b>, she walk<b>ed</b>, they walk<b>ed</b></span>.<br>אין s בעבר. אין הבדל בין גופים. קל.`,
  c:[['עבדתי אתמול.','','I work<b>ed</b> yesterday.'],['היא עבדה אתמול.','She workeds','She work<b>ed</b> yesterday.']]},
 {h:'הגייה של -ed: שלושה צלילים',
  p:`<span class="en">walk<b>ed</b></span> → "ווקט" (/t/, אחרי צליל אטום: k, p, s, sh, ch)<br><span class="en">play<b>ed</b></span> → "פלייד" (/d/, אחרי צליל קולי או תנועה)<br><span class="en">want<b>ed</b></span> → "וונטיד" (/ɪd/, רק אחרי t או d)<br>למה? הלשון מתאימה את הסיום לצליל שלפניו. אחרי t או d אי אפשר להוסיף עוד d בלי תנועה באמצע — אז נכנס "יד".`,
  c:[['walked','','/wɔːkt/'],['played','','/pleɪd/'],['wanted','','/ˈwɒntɪd/']]},
 {h:'פעלים לא-רגילים: כמו בניינים — התנועה משתנה',
  p:`<span class="en">go → <b>went</b>, eat → <b>ate</b>, see → <b>saw</b>, have → <b>had</b>, make → <b>made</b>, take → <b>took</b>, come → <b>came</b>, write → <b>wrote</b>, buy → <b>bought</b>, think → <b>thought</b>, get → <b>got</b>, give → <b>gave</b></span>.<br>אלה הפעלים העתיקים והשכיחים ביותר, ששינו תנועה במקום להוסיף סיומת — קצת כמו ש-<b>כָּתַב</b> הופך ל-<b>כָּתוּב</b>. כ-150 פעלים כאלה מכסים כמעט את כל הדיבור.`,
  c:[['הלכתי הביתה.','I goed home.','I <b>went</b> home.'],['קנינו לחם.','We buyed bread.','We <b>bought</b> bread.']]},
 {h:'שאלה ושלילה: did + פועל בבסיס',
  p:`<span class="en">I <b>went</b></span> → <span class="en"><b>Did</b> you <b>go</b>?</span> → <span class="en">I <b>didn't go</b></span>.<br>העבר עובר ל-<span class="en">did</span>, והפועל חוזר לבסיס. לא <span class="en bad">didn't went</span> — זה עבר פעמיים.<br>מילות זמן: <span class="en">yesterday, last week, in 2010, two years <b>ago</b></span> (ago בא <b>אחרי</b> הזמן: "לפני שנתיים" = two years ago).`,
  c:[['הלכת?','Did you went?','Did you <b>go</b>?'],['לא ראיתי.',"I didn't saw.",'I didn\'t <b>see</b>.'],['לפני שנתיים','before two years','two years <b>ago</b>']]}
],
ex:[
 {t:'type', he:'נסעתי לאילת בשבוע שעבר.', q:'I ___ (go) to Eilat last week.', a:['went'], why:'go הוא לא-רגיל: go → went. "goed" לא קיים.'},
 {t:'choice', he:'ראית את הסרט?', q:'Did you ___ the movie?', opts:['see','saw','seen'], a:0, why:'העבר כבר יושב על Did. הפועל הראשי חוזר לבסיס: see.'},
 {t:'fix', toks:['She',"didn't",'went','home.'], bad:2, opts:['go','goes','going'], a:0, fixed:"She didn't go home.", why:'didn\'t כבר מסמן עבר. went + didn\'t = עבר כפול. אחרי did / didn\'t תמיד בסיס: go.'},
 {t:'sort', buckets:['/t/ "ט"','/d/ "ד"','/ɪd/ "יד"'], items:[['walked',0],['played',1],['wanted',2],['watched',0],['needed',2],['called',1],['kissed',0],['decided',2],['lived',1]], why:'אחרי t/d → "יד" (wanted, needed, decided). אחרי צליל אטום (k, ch, s) → "ט". אחרי צליל קולי (l, v, y) → "ד".'},
 {t:'build', he:'הם קנו בית לפני שנתיים.', words:['They','bought','a','house','two','years','ago'], extra:['before','buyed'], why:'buy → bought (לא-רגיל). "לפני שנתיים" = two years ago — ago אחרי משך הזמן, לא לפניו.'},
 {t:'match', pairs:[['go','went'],['buy','bought'],['think','thought'],['take','took'],['write','wrote'],['come','came']], why:'הפעלים השכיחים ביותר הם דווקא הלא-רגילים — כי מילים שמשתמשים בהן כל יום מתנגדות לשינוי.'},
 {t:'choice', he:'מתי הגעת?', q:'When ___?', opts:['did you arrive','you arrived','did you arrived'], a:0, why:'שאלה בעבר: מילת שאלה + did + נושא + בסיס. arrived + did = עבר כפול.'},
 {t:'type', he:'לא היה לנו זמן.', q:'We ___ (not / have) time.', a:['didn\'t have','did not have'], why:'שלילה בעבר: didn\'t + בסיס. גם עם have — לא hadn\'t (ארכאי).'}
]},

{ id:'perfect', name:'Have you ever…?', he:'Present Perfect', tag:'הזמן שאין לו מקבילה בעברית: עבר שנוגע בהווה',
teach:[
 {h:'"אני גר כאן כבר 10 שנים" — הווה בעברית, משהו אחר באנגלית',
  p:`בעברית זה הווה: <b>אני גר כאן כבר עשר שנים</b>. באנגלית זה לא הווה ולא עבר: <span class="en">I <b>have lived</b> here for ten years</span> — התחיל בעבר, <b>עדיין נכון עכשיו</b>.<br>Present Perfect = גשר בין עבר להווה. עבר פשוט (<span class="en">I lived</span>) היה אומר: פעם גרתי, וזה נגמר.`,
  c:[['אני גר כאן כבר עשר שנים.','I live here for ten years.','I <b>have lived</b> here for ten years.'],['אני מכיר אותו מ-2015.','I know him since 2015.','I <b>have known</b> him since 2015.']]},
 {h:'הצורה: have / has + צורה שלישית (V3)',
  p:`<span class="en">I <b>have</b> seen · she <b>has</b> seen · they <b>have</b> seen</span><br>הצורה השלישית: רגילה = כמו העבר (<span class="en">worked</span>); לא-רגילה = לשנן: <span class="en">go–went–<b>gone</b>, see–saw–<b>seen</b>, eat–ate–<b>eaten</b>, be–was–<b>been</b>, do–did–<b>done</b>, write–wrote–<b>written</b></span>.<br>קיצורים: <span class="en">I've, she's, they've, haven't, hasn't</span>.`,
  c:[['ראיתי את הסרט הזה (כבר).','','I<b>\'ve seen</b> this movie.'],['היא הלכה (ואיננה).','','She <b>has gone</b>.']]},
 {h:'for מול since — הטעות מספר אחת',
  p:`<span class="en"><b>for</b></span> + משך זמן: <span class="en">for three years, for two hours, for a long time</span><br><span class="en"><b>since</b></span> + נקודת התחלה: <span class="en">since 2020, since Monday, since I was a child</span><br>בעברית "מזה שלוש שנים" גורר <span class="en bad">since three years</span>. אבל since מצביע על <b>רגע</b>; for מודד <b>אורך</b>. שלוש שנים זה אורך → for.`,
  c:[['מזה שלוש שנים','since three years','<b>for</b> three years'],['מאז 2020','for 2020','<b>since</b> 2020']]},
 {h:'ניסיון חיים מול אירוע מתוארך',
  p:`<span class="en"><b>Have you ever been</b> to London?</span> (היית פעם?) — מתי לא חשוב, החוויה חשובה.<br>אבל ברגע שיש <b>זמן מוגדר</b> — עבר פשוט: <span class="en">I <b>went</b> to London <b>in 2019</b></span>. הזמן הנקוב "סוגר" את הקשר להווה.<br>מילות מפתח: <span class="en">ever, never, already</span> (כבר), <span class="en">yet</span> (עדיין לא / כבר? בשלילה ובשאלה), <span class="en">just</span> (הרגע).`,
  c:[['היית פעם ביפן?','Did you ever go to Japan?','<b>Have you ever been</b> to Japan?'],['הייתי ביפן ב-2019.','I have been to Japan in 2019.','I <b>was</b> in Japan in 2019.'],['עוד לא אכלתי.',"I didn't eat yet.",'I <b>haven\'t eaten yet</b>.']]}
],
ex:[
 {t:'choice', he:'אני גר כאן כבר עשר שנים.', fig:'pastnow', q:'איזה משפט נכון?', opts:['I have lived here for ten years.','I live here for ten years.','I lived here for ten years.','I am living here since ten years.'], a:0, why:'הציר מראה קו מהעבר עד עכשיו — התחיל אז, ממשיך היום. זה בדיוק Present Perfect. הווה (live) מתעלם מהעבר; עבר (lived) אומר שזה נגמר.'},
 {t:'sort', buckets:['for','since'], items:[['2019',1],['three days',0],['Monday',1],['a long time',0],['I was a child',1],['two hours',0],['yesterday',1],['ages',0]], why:'אם אפשר לענות על "כמה זמן?" → for. אם זו נקודה בזמן ("מאז מתי?") → since.'},
 {t:'fix', toks:['I','have known','him','since','5 years.'], bad:3, opts:['for','from','ago'], a:0, fixed:'I have known him for 5 years.', why:'5 שנים = משך → for. since רק עם נקודת התחלה (since 2021). "מזה" בעברית מטעה.'},
 {t:'choice', he:'אכלת פעם סושי?', q:'Have you ever ___ sushi?', opts:['eaten','ate','eat'], a:0, why:'אחרי have/has באה הצורה השלישית: eat–ate–eaten. ate היא צורת העבר הפשוט ולא מתאימה אחרי have.'},
 {t:'choice', he:'ביקרתי בלונדון ב-2019.', fig:'past', q:'I ___ London in 2019.', opts:['visited','have visited','visit'], a:0, why:'"ב-2019" = זמן מוגדר וסגור → עבר פשוט. Present Perfect לא הולך עם תאריך ספציפי.'},
 {t:'type', he:'היא כבר סיימה את שיעורי הבית.', q:'She ___ (already / finish) her homework.', a:['has already finished'], hint:'has + already + V3', why:'"כבר" = already, יושב בין has ל-V3. הפעולה נגמרה אבל התוצאה רלוונטית עכשיו (שיעורי הבית מוכנים).'},
 {t:'match', pairs:[['go','gone'],['see','seen'],['write','written'],['be','been'],['do','done'],['eat','eaten']], why:'הצורה השלישית של הלא-רגילים היא צורה נפרדת. שימו לב לסיומת -en שחוזרת ברבים מהם.'},
 {t:'build', he:'עוד לא אכלתי.', words:['I',"haven't",'eaten','yet'], extra:["didn't",'already'], why:'"עוד לא" = haven\'t … yet. yet תמיד בסוף המשפט, ורק בשלילה ובשאלות.'}
]},

{ id:'future', name:'Will / going to', he:'עתיד', tag:'עתיד אחד בעברית — ארבעה באנגלית, לפי איך אתה יודע',
teach:[
 {h:'לא "מה יקרה" אלא "איך אתה יודע"',
  p:`בעברית: <b>אלך</b>. באנגלית הבחירה תלויה במקור הידיעה:<br><span class="en"><b>will</b></span> — החלטה ברגע זה, ניבוי, הבטחה: <span class="en">I'll help you!</span><br><span class="en"><b>be going to</b></span> — תוכנית שכבר קיימת, או ניבוי על סמך ראיות: <span class="en">I'm going to study medicine. Look at the clouds — it's going to rain.</span><br><span class="en"><b>Present Continuous</b></span> — סידור קבוע עם אחרים: <span class="en">I'm meeting Dan at 5.</span><br><span class="en"><b>Present Simple</b></span> — לוח זמנים: <span class="en">The train leaves at 9.</span>`,
  c:[['(הטלפון מצלצל) אני אענה!','','I<b>\'ll</b> answer it!'],['אני אלמד רפואה (החלטתי).','','I<b>\'m going to</b> study medicine.'],['אני נפגש איתו ב-5.','','I<b>\'m meeting</b> him at 5.']]},
 {h:'will + פועל בבסיס. בלי to, בלי s',
  p:`<span class="en">She <b>will go</b></span> — לא <span class="en bad">will goes</span>, לא <span class="en bad">will to go</span>.<br>will הוא פועל עזר (מודאלי): הוא נועל את הפועל שאחריו בצורת הבסיס.<br>קיצורים: <span class="en">I'll, you'll, he'll, won't</span> (= will not).`,
  c:[['היא תבוא מחר.','She will comes tomorrow.','She <b>will come</b> tomorrow.'],['אני לא אשכח.','I will not to forget.','I <b>won\'t forget</b>.']]},
 {h:'המלכודת הגדולה: אחרי when / if — הווה, לא עתיד',
  p:`בעברית שני החלקים בעתיד: <b>כש<u>אגיע</u>, <u>אתקשר</u></b>. באנגלית רק החלק העיקרי בעתיד: <span class="en">When I <b>arrive</b>, I <b>will call</b> you.</span><br>למה? המשפט אחרי when / if / before / after / until / as soon as הוא <b>תנאי</b>, לא ניבוי. הוא מתאר מצב, לא מבטיח. ובאנגלית תנאי מנוסח בהווה.<br><span class="en bad">When I will arrive</span> היא הטעות הכי מזוהה של דוברי עברית.`,
  c:[['כשאגיע, אתקשר.','When I will arrive, I will call.','When I <b>arrive</b>, I will call.'],['אם ירד גשם, נישאר בבית.','If it will rain…','If it <b>rains</b>, we will stay home.']]}
],
ex:[
 {t:'choice', he:'(הטלפון מצלצל) — אני אענה!', q:'The phone is ringing. — ___', opts:["I'll answer it!","I'm going to answer it!","I answer it!"], a:0, why:'החלטה שנולדה ברגע זה → will. going to היה מרמז שתכננת מראש לענות לטלפון שעוד לא צלצל.'},
 {t:'choice', he:'תראה את העננים! עומד לרדת גשם.', q:'Look at those clouds! It ___ rain.', opts:['is going to','will','rains'], a:0, why:'ניבוי על סמך ראיות שרואים עכשיו (עננים) → going to. will = ניבוי כללי בלי ראיה.'},
 {t:'fix', toks:['When','I','will arrive,','I will call','you.'], bad:2, opts:['arrive,','arrived,','am arriving,'], a:0, fixed:'When I arrive, I will call you.', why:'אחרי when המשפט הוא תנאי → הווה פשוט. העתיד נשאר רק בחלק העיקרי (I will call). בעברית שניהם בעתיד — וזו המלכודת.'},
 {t:'choice', he:'היא תיסע לפריז בשבוע הבא.', q:'She ___ to Paris next week.', opts:['will go','will goes','wills go'], a:0, why:'will לא משתנה לפי גוף, והפועל אחריו תמיד בבסיס. אין s בשום מקום.'},
 {t:'build', he:'אני אעזור לך מחר.', words:['I','will','help','you','tomorrow'], extra:['helping','to'], why:'will + בסיס (help). לא to help, לא helping. הבטחה → will.'},
 {t:'sort', buckets:['will','going to'], items:[["I've decided — I ___ study law.",1],["It's cold. I ___ close the window.",0],['We ___ get married in June.',1],['I think it ___ snow tomorrow.',0],['Watch out! You ___ fall!',1],["Don't worry, I ___ help you.",0]], why:'תוכנית / החלטה שכבר התקבלה / ראיה מול העיניים → going to. החלטה ספונטנית, הבטחה, ניבוי כללי → will.'},
 {t:'type', he:'הרכבת יוצאת מחר ב-9:15.', q:'The train ___ (leave) at 9:15 tomorrow.', a:['leaves'], why:'לוח זמנים קבוע → Present Simple, גם כשמדובר במחר. הרכבת "תמיד" יוצאת ב-9:15.'},

{ id:'wh', name:'Where / who / how', he:'מילות שאלה', tag:'"I don\'t know where is he" — למה זה שגוי',

  p:`<span class="en"><b>What</b> do you want? <b>Where</b> does she live? <b>When</b> did they leave? <b>Why</b> are you sad? <b>How</b> can I help?</span><br>הסדר קבוע: <b>מילת שאלה + עזר + נושא + פועל</b>. גם <span class="en">how much / how many / how long / how often / how old</span> נחשבות מילת שאלה אחת.`,
  c:[['מה אתה רוצה?','What you want?','What <b>do you</b> want?'],['בן כמה אתה?','How much years you have?','<b>How old are</b> you?']]},
 {h:'Who כנושא — בלי do',
  p:`<b>מי התקשר?</b> → <span class="en"><b>Who called</b>?</span> (לא Who did call)<br><b>למי התקשרת?</b> → <span class="en"><b>Who did you call</b>?</span><br>למה? כשמילת השאלה <b>היא</b> הנושא, אין נושא אחר להפוך איתו — אז המשפט נשאר בסדר רגיל. רק כשהיא המושא נכנס ההיפוך.`,

 {h:'שאלה בתוך משפט — חוזרים לסדר רגיל',
  p:`<span class="en">Where <b>is he</b>?</span> — שאלה ישירה, היפוך.<br><span class="en">I don't know where <b>he is</b>.</span> — לא שאלה! זה משפט חיווי שמכיל שאלה, ולכן <b>בלי היפוך</b>.<br>למה? ההיפוך הוא הסימן של "אני שואל אותך". בתוך משפט אני לא שואל, אני מספר. בעברית הסדר זהה בשני המקרים (איפה הוא? / לא יודע איפה הוא) — ולכן דוברי עברית מעתיקים את ההיפוך פנימה.<br>גם: <span class="en">Can you tell me what time <b>it is</b>? Do you know where <b>she lives</b>?</span> (בלי does!)`,

],

{ id:'neg', name:"I don't", he:'שלילה', tag:'"I not know" ו-"I didn\'t see nobody": שני כללים שעברית לא מכירה',
teach:[
 {h:'"לא" צריך על מה לשבת',
  p:`בעברית <b>לא</b> עומדת לבד לפני הפועל: <b>אני לא יודע</b>. באנגלית <span class="en">not</span> חייבת להיצמד לפועל עזר: <span class="en">I <b>do not</b> know → I <b>don't</b> know</span>.<br>למה? באנגלית מודרנית not לא יכולה לעמוד לפני פועל רגיל (פעם כן: "I know not"). אז do נכנס כווו לתלות עליו את השלילה — בדיוק כמו בשאלות.`,
  c:[['אני לא יודע.','I not know.','I <b>don\'t</b> know.'],['הוא לא עובד.','He no work.','He <b>doesn\'t</b> work.'],['לא ראיתי.','I not saw.','I <b>didn\'t</b> see.']]},
 {h:'איפה יש עזר — השלילה נצמדת אליו',
  p:`<span class="en">I am → I<b>'m not</b> · he is → he <b>isn't</b> · they were → they <b>weren't</b></span><br><span class="en">can → <b>can't</b> · will → <b>won't</b> · should → <b>shouldn't</b> · have (perfect) → <b>haven't</b></span><br>ורק בלי עזר: <span class="en"><b>don't / doesn't / didn't</b></span> + בסיס (<span class="en">he doesn't work</span>, לא works).`,
  c:[['היא לא כאן.',"She doesn't here.",'She <b>isn\'t</b> here.'],['הוא לא אוהב תה.',"He doesn't likes tea.",'He doesn\'t <b>like</b> tea.']]},
 {h:'שלילה אחת בלבד',
  p:`בעברית שלילה כפולה היא חובה: <b>לא ראיתי אף אחד</b>, <b>לא אמרתי כלום</b>. באנגלית תקנית — שלילה <b>אחת</b>:<br><span class="en">I didn't see <b>anyone</b></span> או <span class="en">I saw <b>no one</b></span>. לא <span class="en bad">I didn't see nobody</span>.<br>למה? דקדוקנים במאה ה-18 החליטו ששני "לא" מבטלים זה את זה כמו במתמטיקה. בדיאלקטים (ובשירים) עדיין שומעים כפול — אבל זה נחשב לא-תקני.<br>ולכן: <span class="en">some</span> במשפט חיובי, <span class="en">any</span> בשלילה ובשאלה.`,
  c:[['לא ראיתי אף אחד.',"I didn't see nobody.",'I didn\'t see <b>anybody</b>.'],['אין לי כלום.',"I don't have nothing.",'I don\'t have <b>anything</b>. / I have <b>nothing</b>.'],['אין חלב.',"There isn't some milk.",'There isn\'t <b>any</b> milk.']]}
],

{ id:'short', name:'Yes, I do', he:'תשובות קצרות ותגיות', tag:'למה באנגלית לא עונים סתם "כן"',
teach:[
 {h:'התשובה מהדהדת את מילת העזר',
  p:`בעברית: <b>אתה בא? — כן. / בא.</b><br>באנגלית עונים עם פועל העזר של השאלה: <span class="en">Do you speak English? — Yes, I <b>do</b>. / No, I <b>don't</b>.</span><br><span class="en">Is he a doctor? — Yes, he <b>is</b>. Can you swim? — No, I <b>can't</b>. Did she call? — Yes, she <b>did</b>.</span><br>למה? "Yes" לבד נשמע קצר ויבש. העזר נושא את הזמן, ומאשר בדיוק את מה שנשאל — בלי לחזור על כל המשפט.`,
  c:[['אתה מדבר אנגלית? — כן.','— Yes.','— Yes, I <b>do</b>.'],['היא רופאה? — לא.','— No.','— No, she <b>isn\'t</b>.'],['התקשרת? — כן.','— Yes, I called.','— Yes, I <b>did</b>.']]},
 {h:'תגיות שאלה: "נכון?"',
  p:`בעברית תגית אחת לכל דבר: <b>...נכון? / ...לא?</b> באנגלית התגית משקפת את המשפט: אותו עזר, בהיפוך שלילה.<br><span class="en">It's cold, <b>isn't it</b>? You don't like fish, <b>do you</b>? She can drive, <b>can't she</b>? They went home, <b>didn't they</b>?</span><br>חיובי → תגית שלילית. שלילי → תגית חיובית. (<span class="en">I am → aren't I?</span> — יוצא דופן.)`,
  c:[['קר, נכון?','It\'s cold, no?','It\'s cold, <b>isn\'t it</b>?'],['אתה לא אוהב דגים, נכון?','You don\'t like fish, right?','You don\'t like fish, <b>do you</b>?']]},
 {h:'"גם אני" — So do I / Neither do I',
  p:`<b>אני אוהב פיצה. — גם אני.</b> → <span class="en">I love pizza. — <b>So do I</b>.</span><br><b>אני לא יכול לנהוג. — גם אני לא.</b> → <span class="en">I can't drive. — <b>Neither can I</b>.</span><br>שוב: אותו פועל עזר של המשפט הראשון. בדיבור יומיומי: <span class="en">Me too / Me neither</span>.`,
  c:[['גם אני (חיובי).','I also.','<b>So do I</b>. / Me too.'],['גם אני לא.','I also not.','<b>Neither do I</b>. / Me neither.']]}
],
ex:[
 {t:'choice', he:'אתה מדבר אנגלית? — כן.', q:'Do you speak English? — Yes, I ___.', opts:['do','speak','am'], a:0, why:'השאלה נשאלה עם Do, ולכן התשובה מהדהדת: I do. הפועל speak לא חוזר.'},
 {t:'choice', he:'היא רופאה? — לא.', q:'Is she a doctor? — No, she ___.', opts:["isn't","doesn't",'not'], a:0, why:'השאלה עם Is → התשובה עם isn\'t. doesn\'t היה מתאים רק אם השאלה הייתה עם Does.'},
 {t:'match', pairs:[['Do you like it?','Yes, I do.'],['Is he here?','No, he isn\'t.'],['Can they swim?','Yes, they can.'],['Did she call?','No, she didn\'t.'],['Have you eaten?','Yes, I have.'],['Will you come?','No, I won\'t.']], why:'כל תשובה קצרה = כן / לא + נושא + העזר של השאלה. שישה עזרים שונים, אותו מנגנון.'},
 {t:'choice', he:'קר, נכון?', q:"It's cold, ___?", opts:["isn't it",'is it',"doesn't it",'no'], a:0, why:'משפט חיובי עם is → תגית שלילית עם אותו עזר: isn\'t it. "no?" זה תרגום ישיר מעברית.'},
 {t:'choice', he:'אתה לא אוהב דגים, נכון?', q:"You don't like fish, ___?", opts:['do you',"don't you",'are you'], a:0, why:'משפט שלילי (don\'t) → תגית חיובית (do you). העזר נשאר do כי like הוא פועל רגיל.'},
 {t:'type', he:'הוא יודע לשחות? — כן.', q:'Can he swim? — Yes, he ___.', a:['can'], why:'שאלה עם can → תשובה עם can. המודאל הוא פועל העזר של המשפט.'},
 {t:'choice', he:'אני אוהב פיצה. — גם אני.', q:'I love pizza. — ___', opts:['So do I.','So I do.','Me also.','I also.'], a:0, why:'"גם אני" = So + עזר + נושא. הסדר הפוך (do I), כמו בשאלה. love = פועל רגיל → do.'},
 {t:'choice', he:'היא לא יודעת לנהוג. — גם אני לא.', q:"She can't drive. — ___", opts:['Neither can I.','So can I.','Neither I can.'], a:0, why:'משפט שלילי → Neither + עזר + נושא. So שייך לחיובי בלבד.'}
]},

{ id:'modals', name:'Can / should / must', he:'פעלים מודאליים', tag:'הפעלים ששוברים את כל הכללים — ולמה',
teach:[
 {h:'צורה אחת, בלי to, בלי s, בלי do',
  p:`<span class="en">can, could, should, must, may, might, will, would</span>:<br>• לא משתנים לפי גוף: <span class="en">he <b>can</b></span> (לא cans)<br>• אחריהם פועל בבסיס: <span class="en">I can <b>swim</b></span> (לא can to swim)<br>• שאלה בהיפוך ישיר: <span class="en"><b>Can</b> you help?</span> (לא Do you can)<br>• שלילה ישירה: <span class="en">can<b>'t</b>, should<b>n't</b>, must<b>n't</b></span><br>למה? המודאלים הם פעלים "פגומים" — היסטורית הם היו צורות עבר של פעלים אחרים, ואיבדו את כל התכונות של פועל רגיל. הם מתנהגים כמו be: עזרים בעצמם.`,
  c:[['היא יודעת לשחות.','She cans swim / She can to swim.','She <b>can swim</b>.'],['אתה יכול לעזור לי?','Do you can help me?','<b>Can you</b> help me?']]},
 {h:'המשמעויות מול העברית',
  p:`<b>יכול</b> → <span class="en">can</span> (יכולת / רשות) · <b>יכולתי</b> → <span class="en">could</span><br><b>כדאי / צריך (עצה)</b> → <span class="en">should</span><br><b>חייב</b> → <span class="en">must / have to</span><br><b>אסור</b> → <span class="en">mustn't</span><br><b>לא חייב</b> → <span class="en">don't have to</span> ← <b>המלכודת!</b><br><span class="en">You <b>mustn't</b> go</span> = אסור לך ללכת. <span class="en">You <b>don't have to</b> go</span> = לא חייב, אבל אפשר. שני ניגודים של "חייב" שנראים דומים.`,
  c:[['אסור לעשן כאן.',"You don't have to smoke here.",'You <b>mustn\'t</b> smoke here.'],['אתה לא חייב לבוא.','You mustn\'t come.','You <b>don\'t have to</b> come.'],['כדאי לך לנוח.','You must rest.','You <b>should</b> rest.']]},
 {h:'סולם הנימוס: can → could → would you mind',
  p:`<span class="en">Can you help me?</span> (רגיל) → <span class="en"><b>Could</b> you help me?</span> (מנומס יותר) → <span class="en"><b>Would you mind</b> help<b>ing</b> me?</span> (מאוד מנומס)<br>למה could מנומס יותר? צורת העבר יוצרת <b>מרחק</b> — כאילו הבקשה פחות דחופה, פחות דורשת. באנגלית מרחק = נימוס.`,
  c:[['אפשר לפתוח את החלון?','Can I to open the window?','<b>Could I</b> open the window?']]}
],
ex:[
 {t:'fix', toks:['Do you can','help','me?'], bad:0, opts:['Can you','Do you','You can'], a:0, fixed:'Can you help me?', why:'can הוא עזר בעצמו — הופכים אותו ישירות. do נכנס רק כשאין עזר. שני עזרים ביחד = שגיאה.'},
 {t:'choice', he:'היא מדברת שלוש שפות.', q:'She ___ speak three languages.', opts:['can','cans','can to'], a:0, why:'מודאלים לא מקבלים s ולא to. can + בסיס, לכל הגופים.'},
 {t:'choice', he:'אסור לעשן כאן.', q:'איזה משפט נכון?', opts:["You mustn't smoke here.","You don't have to smoke here.","You not must smoke here."], a:0, why:'"אסור" = mustn\'t (איסור). don\'t have to = "לא חייב" — כלומר מותר לא לעשן, אבל גם מותר לעשן. הפוך לגמרי.', wrong:{1:'don\'t have to = לא חובה. זה אומר שמותר לך לבחור — לא איסור.'}},
 {t:'choice', he:'אתה לא חייב לבוא.', q:'איזה משפט נכון?', opts:["You don't have to come.","You mustn't come.","You can't come."], a:0, why:'"לא חייב" = אין חובה = don\'t have to. mustn\'t היה אומר "אסור לך לבוא".'},
 {t:'type', he:'כדאי לך ללכת לרופא.', q:'You ___ see a doctor.', a:['should'], hint:'עצה, לא פקודה', why:'עצה / המלצה → should. must היה נשמע כמו פקודה; can היה "אתה יכול".'},
 {t:'build', he:'אתה יכול לעזור לי?', words:['Can','you','help','me?'], extra:['Do','to'], why:'מודאל ראשון (היפוך), נושא, פועל בבסיס. בלי Do, בלי to.'},
 {t:'sort', buckets:['must (חייב)',"mustn't (אסור)","don't have to (לא חייב)"], items:[['You ___ stop at a red light.',0],["You ___ park here — it's forbidden.",1],["It's free, so you ___ pay.",2],['You ___ be 18 to vote.',0],["You ___ tell anyone. It's a secret.",1],['We ___ hurry. We have plenty of time.',2]], why:'must = חובה. mustn\'t = איסור. don\'t have to = אין חובה (מותר לבחור). שני האחרונים נראים כמו "שלילה של חייב", אבל אומרים דברים הפוכים.'},
 {t:'match', pairs:[['יכולתי','I could'],['אסור לי','I mustn\'t'],['אני לא חייב','I don\'t have to'],['כדאי לי','I should'],['אולי אבוא','I might come'],['אני חייב','I must']], why:'לכל מודאל גוון משלו: could = יכולת בעבר / נימוס, might = אולי, should = כדאי, must = חייב.'}
]}
]});

LINES.push({
id:'small', name:'Small words', he:'המילים הקטנות', color:'violet',
blurb:'מילות יחס, כמויות וצירופים: המקום שבו העברית "מציצה" מתוך האנגלית שלך.',
stations:[
{ id:'inonat', name:'in / on / at', he:'ב׳ מתפצלת לשלוש', tag:'נקודה, משטח, מיכל — ההיגיון מאחורי in, on ו-at',
teach:[
 {h:'ב׳ אחת בעברית, שלוש מילים באנגלית',
  p:`<b>ב</b>שש, <b>ב</b>יום שני, <b>ב</b>יוני, <b>ב</b>שולחן, <b>ב</b>אוטובוס — הכול ב׳. באנגלית הבחירה תלויה ב<b>צורה</b> שהדובר מדמיין:<br><span class="en"><b>at</b></span> = נקודה (<span class="en">at 6:00, at the door, at home</span>)<br><span class="en"><b>on</b></span> = משטח או קו (<span class="en">on the table, on Monday, on the wall</span>)<br><span class="en"><b>in</b></span> = מיכל, משהו שמקיף (<span class="en">in the box, in June, in Tel Aviv</span>)`,
  c:[['בשש','in six','<b>at</b> six'],['ביום שני','in Monday','<b>on</b> Monday'],['ביוני','on June','<b>in</b> June']]},
 {h:'זמן: at לנקודה, on ליום, in לתקופה',
  p:`<span class="en"><b>at</b> 5 o\'clock, <b>at</b> noon, <b>at</b> night, <b>at</b> the weekend</span> (בריטי)<br><span class="en"><b>on</b> Monday, <b>on</b> May 5th, <b>on</b> my birthday, <b>on</b> the weekend</span> (אמריקאי)<br><span class="en"><b>in</b> 2020, <b>in</b> June, <b>in</b> the morning, <b>in</b> summer, <b>in</b> the 90s</span><br>למה? שעה היא נקודה על הציר. יום הוא "משבצת" בלוח השנה (משטח). חודש ושנה הם תקופות שמכילות ימים (מיכל).<br>יוצא דופן שכדאי לזכור: <span class="en">at night</span> אבל <span class="en">in the morning</span>.`,
  c:[['בלילה','in the night','<b>at</b> night'],['בבוקר','at the morning','<b>in</b> the morning'],['ב-5 במאי','in May 5th','<b>on</b> May 5th']]},
 {h:'מקום: in לפנים, on למשטח, at לנקודה',
  p:`<span class="en"><b>in</b> the car, <b>in</b> the room, <b>in</b> Israel, <b>in</b> the picture</span><br><span class="en"><b>on</b> the table, <b>on</b> the wall, <b>on</b> the bus / train / plane</span> (עולים עליהם והולכים בתוכם), <span class="en"><b>on</b> TV, <b>on</b> the internet</span><br><span class="en"><b>at</b> home, <b>at</b> school, <b>at</b> work, <b>at</b> the airport, <b>at</b> the door</span> (המקום כנקודת מפגש, לא כחלל)<br>וכלום לפני: <span class="en">home</span> אחרי פועל תנועה (<span class="en">go home</span>), <span class="en">next / last / this / every</span> (<span class="en">next week</span>, לא in next week).`,
  c:[['באוטובוס','in the bus','<b>on</b> the bus'],['הלכתי הביתה','I went to home','I went <b>home</b>'],['בשבוע הבא','in the next week','<b>next week</b>']]}
],
ex:[
 {t:'sort', buckets:['at','on','in'], items:[['5 o\'clock',0],['Monday',1],['June',2],['night',0],['the morning',2],['my birthday',1],['2019',2],['noon',0],['May 5th',1]], why:'נקודת זמן (שעה, noon, night) → at. יום / תאריך → on. תקופה (חודש, שנה, חלק מהיום) → in.'},
 {t:'sort', buckets:['at','on','in'], items:[['the table',1],['the car',2],['home',0],['the bus',1],['Tel Aviv',2],['the door',0],['the wall',1],['the box',2],['work',0]], why:'משטח (שולחן, קיר, אוטובוס) → on. פנים / עיר / מיכל → in. נקודת מפגש (בית, עבודה, דלת) → at.'},
 {t:'choice', he:'נתראה ביום שני.', q:"I'll see you ___ Monday.", opts:['on','in','at'], a:0, why:'ימים → on. חשבו על משבצת בלוח שנה: משהו "על" היום הזה.'},
 {t:'fix', toks:['We','arrived','in','home','late.'], bad:2, opts:['∅ (למחוק)','at','to'], a:0, fixed:'We arrived home late.', why:'home אחרי פועל תנועה (go, come, arrive, get) בא בלי מילת יחס בכלל. אבל "at home" למיקום סטטי: I am at home.'},
 {t:'type', he:'היא נולדה ב-1995.', q:'She was born ___ 1995.', a:['in'], why:'שנה = תקופה שמכילה חודשים וימים → in.'},
 {t:'choice', he:'אתה באוטובוס?', q:'Are you ___ the bus?', opts:['on','in','at'], a:0, why:'אוטובוס, רכבת, מטוס, אונייה → on (עולים עליהם ואפשר ללכת בתוכם). מכונית ומונית → in (נכנסים ויושבים).'},
 {t:'build', he:'אני נפגש איתה בשש בערב.', words:["I'm",'meeting','her','at','six','in','the','evening'], extra:['on','in six'], why:'שעה → at six. חלק מהיום → in the evening. שתי ב׳ בעברית, שתי מילים שונות באנגלית.'},
 {t:'choice', he:'ראיתי את זה בטלוויזיה.', q:'I saw it ___ TV.', opts:['on','in','at'], a:0, why:'on TV, on the radio, on the internet, on the phone — ערוצי תקשורת הם "משטח" שהמידע מופיע עליו.'}
